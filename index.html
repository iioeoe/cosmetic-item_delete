<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>💄 화장품 재고 관리</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fffafa;
    --app-bg: #f5ece3;
    --card: #ffffff;
    --accent: #EBA5A7;
    --accent-dark: #d48a8c;
    --accent-light: #f7d5d6;
    --text: #3f3f3f;
    --text2: #5a5959;
    --border: #e8e8e8;
    --block-header: #EBA5A7;
    --block-header-text: #ffffff;
    --radius: 10px;
    --tag-bg: #fde8ed;
    --tag-text: #c0606a;
    --in-use-bg: #c6e1ed;
    --in-use-text: #9ac1d2;
    --expired-bg: #fdeaea;
    --expired-text: #b04040;
    --soon-text: #f9cd76;
    --app-width: 480px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  /* PC에서 모바일 컨테이너 */
  html, body {
    height: 100%;
    font-family: 'Nanum Gothic', sans-serif;
    background: var(--app-bg);
  }
  body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  #app {
    width: 100%;
    max-width: var(--app-width);
    min-height: 100vh;
    background: var(--bg);
    position: relative;
    box-shadow: 0 0 40px rgba(0,0,0,0.13);
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* 버튼 공통 */
  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 7px 14px;
    font-family: 'Nanum Gothic', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: background 0.15s, transform 0.1s;
  }
  .btn:active { transform: scale(0.96); background: var(--accent-dark); }
  .btn:hover  { background: var(--accent-dark); }
  .btn.ghost {
    background: rgba(235,165,167,0.15);
    color: var(--accent-dark);
    border: 1.5px solid #EBA5A7;
  }
  .btn.ghost:hover { background: rgba(235,165,167,0.3); }
  .btn.white {
    background: #fff;
    color: var(--accent);
    border: 1.5px solid var(--accent);
  }
  .btn.white:hover { background: var(--tag-bg); }
  .btn.sm { padding: 5px 10px; font-size: 0.75rem; }

  /* 상단 통합 블럭 (타이틀 + 요약) */
  .top-block {
    margin: 12px 12px 0;
    border-radius: var(--radius);
    overflow: hidden;
    border: 2px solid #FFD6EF;
    box-shadow: 0 1px 6px rgba(0,0,0,0.07);
  }
  .top-block-header {
    background: #FDEAEA;
    color: var(--text);
    padding: 12px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid #FFD6EF;
  }
  .top-block-header h1 { font-size: 1.05rem; font-weight: 800; letter-spacing: -0.3px; color: var(--text); }
  .top-block-header p  { font-size: 0.7rem; color: var(--text2); margin-top: 2px; }
  .top-block-header .header-left { display: flex; flex-direction: column; }
  .top-block-header .header-btns { display: flex; gap: 6px; }
  .top-block-body {
    background: #FDEAEA;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 7px;
    padding: 8px;
  }
  .top-block-body .sum-cell {
    text-align: center;
    border-radius: 8px;
    overflow: hidden;
    border: 1.5px solid #FFD6EF;
  }
  .sum-cell .s-label {
    font-size: 0.72rem;
    font-weight: 800;
    color: #fff;
    background: #EBA5A7;
    padding: 5px 4px;
    display: block;
  }
  /* 개별 라벨 색상 */
  .sum-cell.cell-stock  .s-label { background: #c682b1; }
  .sum-cell.cell-total  .s-label { background: #EBA5A7; }
  .sum-cell.cell-inuse  .s-label { background: #9ac1d2; }
  .sum-cell.cell-soon   .s-label { background: #f0c060; }

  .sum-cell .s-num {
    font-size: 1.2rem;
    font-weight: 800;
    color: var(--text);
    line-height: 1;
    padding: 8px 4px;
    display: block;
  }
  /* 개별 숫자 배경색 */
  .sum-cell.cell-stock .s-num { background: #f6d3eb; color: #c682b1; }
  .sum-cell.cell-total .s-num { background: #fee3e3; color: #f4aaab; }
  .sum-cell.cell-inuse .s-num { background: #c6e0ec; color: #9ac1d2; }
  .sum-cell.cell-soon  .s-num { background: #f9e8c5; color: #f9cd76; }

  /* 브랜드 탭 (pill 형태 독립 행) */
  .brand-tab-wrap {
    margin: 10px 12px 0;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 2px;
  }
  .brand-tab-wrap::-webkit-scrollbar { display: none; }
  .brand-tab {
    flex-shrink: 0;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: #fff;
    color: var(--text2);
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
  }
  .brand-tab.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .brand-tab .cnt {
    font-size: 0.68rem;
    margin-left: 3px;
    opacity: 0.75;
  }

  /* 리스트 패널 */
  .list-block {
    margin: 8px 12px 24px;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--border);
    box-shadow: 0 1px 6px rgba(0,0,0,0.06);
    background: var(--bg);
    padding: 10px;
  }
  .list-block-header { display: none; }
  .list-block-title  { display: none; }
  .list-block-body   { background: transparent; padding: 0; }

  /* 상품 그룹 블럭 */
  .product-block {
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--border);
    margin-bottom: 10px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.06);
  }

  /* 블럭 타이틀바 */
  .product-block-header {
    background: var(--accent);
    color: #fff;
    padding: 9px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
  }
  .product-block-header .pname {
    font-size: 0.9rem;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .stock-pill {
    background: #efc6e2;
    color: #c682b1;
    border-radius: 10px;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 2px 8px;
  }
  .inuse-pill {
    background: rgba(255,255,255,0.15);
    color: #fff;
    border-radius: 10px;
    font-size: 0.68rem;
    font-weight: 700;
    padding: 1px 7px;
    border: 1px solid rgba(255,255,255,0.4);
  }
  .chevron { font-size: 0.75rem; opacity: 0.8; transition: transform 0.2s; }
  .chevron.open { transform: rotate(180deg); }

  /* 구매 아이템 리스트 */
  .purchase-list {
    background: var(--card);
  }

  /* 구매 아이템 */
  .purchase-item {
    border-bottom: 1px solid var(--border);
    overflow: hidden;
  }
  .purchase-item:last-child { border-bottom: none; }

  /* 아이템 내부: 라벨행 + 내용행 */
  .item-label-row {
    background: #f8f8f8;
    display: grid;
    grid-template-columns: 90px 90px 1fr 70px;
    border-bottom: 1px solid var(--border);
  }
  .item-label-row span {
    font-size: 0.65rem;
    font-weight: 700;
    color: var(--text2);
    padding: 4px 8px;
    border-right: 1px solid var(--border);
    text-align: center;
  }
  .item-label-row span:last-child { border-right: none; }

  .item-value-row {
    display: grid;
    grid-template-columns: 90px 90px 1fr 70px;
    align-items: center;
  }
  .item-value-row .cell {
    font-size: 0.78rem;
    padding: 7px 8px;
    border-right: 1px solid var(--border);
    color: var(--text);
    text-align: center;
    word-break: keep-all;
  }
  .item-value-row .cell:last-child { border-right: none; }
  .item-value-row .cell.price { font-weight: 700; }
  .item-value-row .cell.actions {
    display: flex;
    flex-direction: column;
    gap: 3px;
    align-items: center;
    padding: 5px 6px;
  }

  /* 상태 태그 */
  .stag {
    display: inline-block;
    font-size: 0.66rem;
    font-weight: 700;
    border-radius: 6px;
    padding: 2px 6px;
  }
  .stag.in-use   { background: var(--in-use-bg); color: var(--in-use-text); }
  .stag.in-stock { background: var(--tag-bg); color: var(--tag-text); }
  .stag.used     { background: #f0f0f0; color: #999; }
  .stag.expired  { background: var(--expired-bg); color: var(--expired-text); }

  /* 유효기간 표시 */
  .exp-row {
    background: #fafafa;
    border-top: 1px solid var(--border);
    padding: 4px 10px;
    font-size: 0.68rem;
    color: var(--text2);
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .exp-row.soon    { background: #fff8f0; color: var(--soon-text); font-weight: 700; }
  .exp-row.expired { background: #fff0f0; color: var(--expired-text); font-weight: 700; }

  /* 아이콘 버튼 */
  .icon-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 0.9rem;
    padding: 2px 4px;
    border-radius: 4px;
    transition: background 0.12s;
    line-height: 1;
  }
  .icon-btn:hover { background: var(--tag-bg); }
  .open-btn {
    font-size: 0.68rem;
    font-weight: 700;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 3px 7px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.12s;
  }
  .open-btn:hover { background: var(--accent-dark); }

  /* 빈 상태 */
  .empty-state {
    text-align: center;
    padding: 50px 20px;
    color: var(--text2);
    font-size: 0.88rem;
  }
  .empty-state .icon { font-size: 2.2rem; margin-bottom: 10px; }

  /* 모달 */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(40,20,20,0.4);
    z-index: 200;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg);
    border-radius: 16px 16px 0 0;
    padding: 20px 16px 30px;
    width: 100%;
    max-width: var(--app-width);
    box-shadow: 0 -4px 30px rgba(0,0,0,0.15);
    overflow-y: auto;
  }
  .modal-handle {
    width: 36px; height: 4px;
    background: #ddd;
    border-radius: 2px;
    margin: 0 auto 16px;
  }
  .modal h2 {
    font-size: 1rem;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  /* 모달 내 블럭 스타일 폼 */
  .form-block {
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--border);
    margin-bottom: 10px;
  }
  .form-block-title {
    background: var(--accent);
    color: #fff;
    font-size: 0.72rem;
    font-weight: 800;
    padding: 5px 10px;
  }
  .form-block-body {
    background: #fff;
    padding: 10px;
  }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .form-group { display: flex; flex-direction: column; gap: 3px; }
  .form-group label {
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--text2);
  }
  .form-group input,
  .form-group select {
    padding: 8px 10px;
    border: 1.5px solid var(--border);
    border-radius: 7px;
    font-family: 'Nanum Gothic', sans-serif;
    font-size: 0.85rem;
    color: var(--text);
    background: #fff;
    outline: none;
    transition: border-color 0.15s;
  }
  .form-group input:focus,
  .form-group select:focus { border-color: var(--accent); }
  .modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    justify-content: flex-end;
  }

  /* 브랜드 관리 리스트 */
  .brand-manage-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    margin-bottom: 6px;
  }
  .brand-manage-item span { font-weight: 700; font-size: 0.88rem; color: var(--text); }

  @media (min-width: 430px) {
    .modal { border-radius: 16px; margin-bottom: 20px; }
    .modal-overlay { align-items: center; }
  }
</style>
</head>
<body>
<div id="app">

<!-- 상단 블럭: 타이틀 + 요약 -->
<div class="top-block">
  <div class="top-block-header">
    <div class="header-left">
      <h1>💄 화장품 재고 관리</h1>
      <p>구매내역 · 사용기록 · 잔여재고</p>
    </div>
    <div class="header-btns">
      <button class="btn ghost sm" onclick="openManageBrands()">🏷️ 브랜드</button>
      <button class="btn ghost sm" onclick="openAddModal()">＋ 추가</button>
    </div>
  </div>
  <div class="top-block-body" id="summaryBar"></div>
</div>

<!-- 브랜드 탭 (독립 pill 행) -->
<div class="brand-tab-wrap" id="brandTabs"></div>

<!-- 리스트 패널 -->
<div class="list-block">
  <div class="list-block-body" id="mainPanel"></div>
</div>

</div><!-- /#app -->

<!-- 구매 추가/수정 모달 -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2 id="addModalTitle">🛒 구매 내역 추가</h2>

    <div class="form-block">
      <div class="form-block-title">기본 정보</div>
      <div class="form-block-body">
        <div class="form-group" style="margin-bottom:8px">
          <label>브랜드</label>
          <select id="inp_brand"></select>
        </div>
        <div class="form-group">
          <label>상품명</label>
          <input type="text" id="inp_product" placeholder="예: 수분크림, 토너">
        </div>
      </div>
    </div>

    <div class="form-block">
      <div class="form-block-title">구매 정보</div>
      <div class="form-block-body">
        <div class="form-row">
          <div class="form-group">
            <label>구매일자</label>
            <input type="text" id="inp_buyDate" placeholder="YYYY-MM-DD" maxlength="10">
          </div>
          <div class="form-group">
            <label>구매금액 (원)</label>
            <input type="number" id="inp_price" placeholder="0">
          </div>
        </div>
      </div>
    </div>

    <div class="form-block">
      <div class="form-block-title">유효기간 · 메모</div>
      <div class="form-block-body">
        <div class="form-group" style="margin-bottom:8px">
          <label>유효기간</label>
          <input type="text" id="inp_expDate" placeholder="YYYY-MM-DD" maxlength="10">
        </div>
        <div class="form-group">
          <label>메모</label>
          <input type="text" id="inp_memo" placeholder="구매처, 용량 등">
        </div>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn white" onclick="closeModal('addModal')">취소</button>
      <button class="btn" onclick="saveItem()">저장</button>
    </div>
  </div>
</div>

<!-- 브랜드 관리 모달 -->
<div class="modal-overlay" id="brandModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2>🏷️ 브랜드 관리</h2>
    <div class="form-block">
      <div class="form-block-title">새 브랜드 추가</div>
      <div class="form-block-body" style="display:flex;gap:8px;">
        <input type="text" id="newBrandInput" placeholder="브랜드명 입력"
          style="flex:1;padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;font-family:'Nanum Gothic',sans-serif;font-size:0.85rem;outline:none;">
        <button class="btn" onclick="addBrand()" style="border-radius:7px;">추가</button>
      </div>
    </div>
    <div id="brandList"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('brandModal')">완료</button>
    </div>
  </div>
</div>

<!-- 개봉(사용) 기록 모달 -->
<div class="modal-overlay" id="useModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2>✅ 개봉 기록</h2>
    <div class="form-block">
      <div class="form-block-title">상품 정보</div>
      <div class="form-block-body">
        <p style="font-size:0.85rem;color:var(--text2);" id="useModalDesc"></p>
      </div>
    </div>
    <div class="form-block">
      <div class="form-block-title">개봉일</div>
      <div class="form-block-body">
        <div class="form-group">
          <label>사용 시작일</label>
          <input type="text" id="inp_useDate" placeholder="YYYY-MM-DD" maxlength="10">
        </div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn white" onclick="closeModal('useModal')">취소</button>
      <button class="btn" onclick="confirmUse()">확인</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'cosmeticTracker_v1';
function loadData() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || getDefaultData(); }
  catch { return getDefaultData(); }
}
function saveData(d) { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }
function getDefaultData() {
  return {
    brands: ['설화수', 'SK-II', '라네즈', '기타'],
    items: [
      { id:1, brand:'설화수', product:'윤조에센스', buyDate:'2024-10-15', price:85000, expDate:'2026-10-14', memo:'백화점 구매', useDate:'2024-10-20', status:'in-use' },
      { id:2, brand:'설화수', product:'자음생크림', buyDate:'2024-11-01', price:120000, expDate:'2026-10-31', memo:'', useDate:null, status:'in-stock' },
      { id:3, brand:'SK-II', product:'피테라에센스', buyDate:'2024-09-05', price:195000, expDate:'2026-09-04', memo:'면세점', useDate:'2024-09-10', status:'in-use' },
      { id:4, brand:'SK-II', product:'피테라에센스', buyDate:'2025-01-20', price:195000, expDate:'2027-01-19', memo:'면세점', useDate:null, status:'in-stock' },
      { id:5, brand:'라네즈', product:'워터뱅크크림', buyDate:'2025-02-10', price:39000, expDate:'2027-02-09', memo:'', useDate:null, status:'in-stock' },
    ]
  };
}

let data = loadData();
let currentBrand = data.brands[0] || '';
let editItemId = null;
let useItemId = null;

// ── 렌더 ─────────────────────────────────────
function render() { renderSummary(); renderTabs(); renderPanel(); }

function renderSummary() {
  const total = data.items.length;
  const inUse = data.items.filter(i => i.status === 'in-use').length;
  const td = new Date(); td.setHours(0,0,0,0);
  const soon = data.items.filter(i => {
    if (!i.expDate || i.status === 'used') return false;
    const diff = (new Date(i.expDate) - td) / 86400000;
    return diff >= 0 && diff <= 30;
  }).length;
  const inStock = data.items.filter(i => i.status === 'in-stock').length;
  document.getElementById('summaryBar').innerHTML = `
    <div class="sum-cell cell-stock"><div class="s-label">재고</div><div class="s-num">${inStock}</div></div>
    <div class="sum-cell cell-total"><div class="s-label">전체</div><div class="s-num">${total}</div></div>
    <div class="sum-cell cell-inuse"><div class="s-label">사용중</div><div class="s-num">${inUse}</div></div>
    <div class="sum-cell cell-soon"><div class="s-label">만료임박</div><div class="s-num">${soon}</div></div>`;
}

function renderTabs() {
  document.getElementById('brandTabs').innerHTML = data.brands.map(b => {
    const cnt = data.items.filter(i => i.brand === b).length;
    return `<div class="brand-tab ${b===currentBrand?'active':''}" onclick="selectBrand('${b}')">
      ${b}<span class="cnt">${cnt}</span>
    </div>`;
  }).join('');
}

function renderPanel() {
  const items = data.items.filter(i => i.brand === currentBrand);
  const el = document.getElementById('mainPanel');
  if (!items.length) {
    el.innerHTML = `<div class="empty-state"><div class="icon">💄</div>등록된 상품이 없습니다.<br><br><button class="btn" onclick="openAddModal()">＋ 첫 상품 추가</button></div>`;
    return;
  }
  const groups = {};
  items.forEach(it => { if (!groups[it.product]) groups[it.product]=[]; groups[it.product].push(it); });
  const td = new Date(); td.setHours(0,0,0,0);

  el.innerHTML = Object.entries(groups).map(([product, list]) => {
    const inStock = list.filter(i=>i.status==='in-stock').length;
    const inUse   = list.filter(i=>i.status==='in-use').length;
    const stockNum = inStock + inUse;

    const itemsHtml = list.sort((a,b)=>new Date(b.buyDate)-new Date(a.buyDate)).map(item => {
      const expD = item.expDate ? new Date(item.expDate) : null;
      const diff = expD ? (expD - td) / 86400000 : 999;
      let expClass='', expLabel='';
      if (expD) {
        if (diff < 0)       { expClass='expired'; expLabel='⚠️ 기한 만료'; }
        else if (diff <= 30){ expClass='soon';    expLabel=`⚠️ D-${Math.ceil(diff)} 만료임박`; }
        else                { expLabel=`유효기간: ${item.expDate}`; }
      }
      const sMap = { 'in-use':'사용중', 'in-stock':'미개봉', 'used':'사용완료', 'expired':'기한만료' };
      const statusLabel = sMap[item.status] || '';

      const openBtn  = item.status==='in-stock' ? `<button class="open-btn" onclick="openUseModal(${item.id})">개봉</button>` : '';
      const useInfo  = item.useDate ? `<span style="font-size:0.65rem;color:var(--text2);">개봉 ${item.useDate}</span>` : '';

      return `<div class="purchase-item">
        <div class="item-label-row">
          <span>구매일자</span><span>구매금액</span><span>상태</span><span>관리</span>
        </div>
        <div class="item-value-row">
          <div class="cell">${item.buyDate}</div>
          <div class="cell price">${item.price ? Number(item.price).toLocaleString()+'원' : '-'}</div>
          <div class="cell">
            <span class="stag ${item.status}">${statusLabel}</span>
            ${useInfo}
          </div>
          <div class="cell actions">
            ${openBtn}
            <div style="display:flex;gap:2px;">
              <button class="icon-btn" onclick="openEditModal(${item.id})">✏️</button>
              <button class="icon-btn" onclick="deleteItem(${item.id})">🗑️</button>
            </div>
          </div>
        </div>
        ${expD ? `<div class="exp-row ${expClass}">${expLabel}${item.memo ? ' · '+item.memo : ''}</div>` : (item.memo ? `<div class="exp-row">📝 ${item.memo}</div>` : '')}
      </div>`;
    }).join('');

    return `<div class="product-block">
      <div class="product-block-header" onclick="toggleGroup(this)">
        <div class="pname">
          ${product}
          <span class="stock-pill">재고 ${stockNum}개</span>
          ${inUse>0 ? `<span class="inuse-pill">사용중 ${inUse}</span>` : ''}
        </div>
        <span class="chevron open">▼</span>
      </div>
      <div class="purchase-list">${itemsHtml}</div>
    </div>`;
  }).join('');
}

function toggleGroup(header) {
  const list = header.nextElementSibling;
  const chev = header.querySelector('.chevron');
  const isHidden = list.style.display === 'none';
  list.style.display = isHidden ? 'block' : 'none';
  isHidden ? chev.classList.add('open') : chev.classList.remove('open');
}
function selectBrand(b) { currentBrand = b; render(); }

// ── 브랜드 관리 ──────────────────────────────────────
function openManageBrands() { renderBrandList(); document.getElementById('brandModal').classList.add('open'); }
function renderBrandList() {
  document.getElementById('brandList').innerHTML = data.brands.map((b,i) =>
    `<div class="brand-manage-item">
      <span>${b}</span>
      <button class="icon-btn" onclick="deleteBrand(${i})">🗑️</button>
    </div>`
  ).join('');
}
function addBrand() {
  const v = document.getElementById('newBrandInput').value.trim();
  if (!v) return;
  if (data.brands.includes(v)) { alert('이미 있는 브랜드입니다.'); return; }
  data.brands.push(v); saveData(data);
  document.getElementById('newBrandInput').value = '';
  renderBrandList(); render();
}
function deleteBrand(i) {
  const b = data.brands[i];
  if (data.items.some(it=>it.brand===b)) {
    if (!confirm(`'${b}' 브랜드 상품이 있습니다. 삭제하시겠습니까?`)) return;
  }
  data.brands.splice(i,1);
  if (currentBrand===b) currentBrand = data.brands[0]||'';
  saveData(data); renderBrandList(); render();
}

// ── 추가 / 수정 ──────────────────────────────────────
function openAddModal() {
  editItemId = null;
  document.getElementById('addModalTitle').textContent = '🛒 구매 내역 추가';
  clearForm();
  document.getElementById('inp_buyDate').value = todayStr();
  populateBrandSelect();
  document.getElementById('addModal').classList.add('open');
}
function openEditModal(id) {
  editItemId = id;
  const item = data.items.find(i=>i.id===id); if (!item) return;
  document.getElementById('addModalTitle').textContent = '✏️ 내역 수정';
  populateBrandSelect(item.brand);
  document.getElementById('inp_product').value  = item.product;
  document.getElementById('inp_buyDate').value  = item.buyDate;
  document.getElementById('inp_price').value    = item.price||'';
  document.getElementById('inp_expDate').value  = item.expDate||'';
  document.getElementById('inp_memo').value     = item.memo||'';
  document.getElementById('addModal').classList.add('open');
}
function populateBrandSelect(selected) {
  document.getElementById('inp_brand').innerHTML =
    data.brands.map(b=>`<option value="${b}" ${b===(selected||currentBrand)?'selected':''}>${b}</option>`).join('');
}
function clearForm() {
  ['inp_product','inp_buyDate','inp_price','inp_expDate','inp_memo'].forEach(id=>{
    document.getElementById(id).value='';
  });
}
function saveItem() {
  const brand   = document.getElementById('inp_brand').value;
  const product = document.getElementById('inp_product').value.trim();
  const buyDate = document.getElementById('inp_buyDate').value;
  const price   = document.getElementById('inp_price').value;
  const expDate = document.getElementById('inp_expDate').value;
  const memo    = document.getElementById('inp_memo').value.trim();
  if (!product||!buyDate) { alert('상품명과 구매일자는 필수입니다.'); return; }
  if (editItemId) {
    Object.assign(data.items.find(i=>i.id===editItemId), {brand,product,buyDate,price:price?Number(price):null,expDate,memo});
  } else {
    data.items.push({id:Date.now(),brand,product,buyDate,price:price?Number(price):null,expDate,memo,useDate:null,status:'in-stock'});
  }
  saveData(data); currentBrand=brand; closeModal('addModal'); render();
}

// ── 개봉 기록 ──────────────────────────────────────
function openUseModal(id) {
  useItemId = id;
  const item = data.items.find(i=>i.id===id);
  document.getElementById('useModalDesc').textContent = `${item.brand} · ${item.product} (구매: ${item.buyDate})`;
  document.getElementById('inp_useDate').value = todayStr();
  document.getElementById('useModal').classList.add('open');
}
function confirmUse() {
  const useDate = document.getElementById('inp_useDate').value;
  if (!useDate) { alert('날짜를 입력해 주세요.'); return; }
  const item = data.items.find(i=>i.id===useItemId);
  item.useDate=useDate; item.status='in-use';
  saveData(data); closeModal('useModal'); render();
}

// ── 삭제 ──────────────────────────────────────
function deleteItem(id) {
  if (!confirm('삭제하시겠습니까?')) return;
  data.items=data.items.filter(i=>i.id!==id); saveData(data); render();
}

// ── 날짜 자동포맷 ──────────────────────────────────────
function applyDateFmt(input) {
  input.addEventListener('input', function() {
    let v = this.value.replace(/\D/g,'');
    if (v.length<=4) this.value=v;
    else if (v.length<=6) this.value=v.slice(0,4)+'-'+v.slice(4);
    else this.value=v.slice(0,4)+'-'+v.slice(4,6)+'-'+v.slice(6,8);
  });
}
function initDateInputs() {
  ['inp_buyDate','inp_expDate','inp_useDate'].forEach(id=>{
    const el=document.getElementById(id); if(el) applyDateFmt(el);
  });
}

// ── 유틸 ──────────────────────────────────────
function todayStr() { return new Date().toISOString().slice(0,10); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-overlay').forEach(el=>{
  el.addEventListener('click', e=>{ if(e.target===el) el.classList.remove('open'); });
});

initDateInputs();
render();
</script>
</body>
</html>
