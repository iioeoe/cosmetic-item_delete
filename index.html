<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 화장품 컬렉션</title>
<link rel="icon" href="icon_cosmetic.png">
<link rel="apple-touch-icon" href="icon_cosmetic.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FEFCF9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="화장품 컬렉션">
<style>
  :root{
    --bg:#FEFCF9;          /* 페이지 배경 */
    --card-bg:rgba(255,255,255,0.58);      /* 홈 탭 요약·도넛 카드 배경 */
    --card-border:rgba(255,255,255,0.65);  /* 홈 탭 요약·도넛 카드 테두리 */
    --card-blur:blur(10px);                /* 홈 탭 요약·도넛 카드 블러 */
    --tab-circle:46px;     /* 하단 메뉴 아이콘 원 크기 */
    --tab-icon:22px;       /* 메뉴 아이콘 크기 */
    --cream:#BCD1E3;       /* 선택된 탭 · 버튼 박스 공통 색 */   /* 예전 노랑: #FFF2D4 */
    --add-btn-bg:#3D332C;  /* 리스트 탭 '+ 추가' · 스케줄 탭 '+ 일정' 버튼 배경 */
    --add-btn-text:#FFFFFF; /* 위 버튼 글자색 */
    --green-bg:#DCEFDC; --green-tx:#2E6B3E;  /* 보유 제품 수 아이콘 */
    --card:#FFFFFF;
    --border:#FFF2D4;      /* 테두리 색 (선택 색과 분리) */
    --text:#3D332C;
    --text-sub:#8A7F72;
    --text-mute:#B3A99C;
    --coral-bg:#F7DCC9; --coral-tx:#7A4B2E;
    --blue-bg:#D9E6F2;  --blue-tx:#2E5578;
    --purple-bg:#E3DCF2; --purple-tx:#4A3B78;
    --pink-bg:#F4DCE6;  --pink-tx:#7A3B54;
    --amber-bg:#F7E9C9; --amber-tx:#7A5B1E;
    --honey-bg:#FDE6B1; --honey-tx:#7A5B1E;  /* 브랜드 6번째 색 */
    --sale-bg:#DCEFDC; --sale-tx:#2E6B3E;
    --plain-bg:#EDEBE6; --plain-tx:#8A8478;
    --danger:#C4574A;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}  /* 폰에서 누를 때 뜨는 파란 네모 제거 */
  html, body{overflow-x:hidden; max-width:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px; margin:0 auto; padding:20px 16px 60px;}
  @media(min-width:720px){ .wrap{ padding:36px 24px 80px; } }

  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  header h1{font-size:19px; font-weight:600; margin:0;}
  header p{font-size:12px; color:var(--text-sub); margin:2px 0 0;}
  #mainAddBtn{
    background:var(--add-btn-bg); color:var(--add-btn-text); border:none; border-radius:20px;
    padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer;
  }
  #mainAddBtn:active{opacity:.85;}
  #mainAddBtn.hidden{display:none;}

  .tabbar{display:flex; background:var(--bg); border:1px solid var(--border); border-radius:22px; padding:10px 4px 12px; margin-bottom:20px;}
  .tabbar button{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; border:none; background:none; padding:0; font-size:12.5px; font-weight:500; color:var(--text-sub); cursor:pointer;}
  .tabbar .tabIco{width:var(--tab-circle); height:var(--tab-circle); border-radius:50%; display:flex; align-items:center; justify-content:center;}
  .tabbar .tabIco svg{width:var(--tab-icon); height:var(--tab-icon);}
  .tabbar button.active{color:var(--text); font-weight:700;}
  .tabbar button.active .tabIco{background:var(--cream);}

  .tabpanel{display:none;}
  .tabpanel.active{display:block;}

  .stats{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:22px;}
  @media(min-width:560px){ .stats{grid-template-columns:repeat(4,1fr);} }
  .stat{
    background:var(--card-bg); border:1px solid var(--card-border); border-radius:16px;
    backdrop-filter:var(--card-blur); -webkit-backdrop-filter:var(--card-blur);
    padding:16px 14px 14px; display:flex; flex-direction:column; gap:12px; min-height:128px;
  }
  .stat .icoWrap{width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .stat .icoWrap svg{width:16px; height:16px;}
  .stat .icoWrap.txt{font-size:14px; font-weight:800;}
  .stat.c1 .icoWrap{background:var(--coral-bg); color:var(--coral-tx);}
  .stat.c2 .icoWrap{background:var(--green-bg); color:var(--green-tx);}
  .stat.c3 .icoWrap{background:var(--purple-bg); color:var(--purple-tx);}
  .stat.c4 .icoWrap{background:var(--pink-bg); color:var(--pink-tx);}
  .stat .lbl{font-size:12px; color:var(--text-sub); margin:0;}
  .stat .val{font-size:19px; font-weight:700; color:var(--text); margin:2px 0 0;}
  .stat .delta{font-size:10.5px; color:var(--text-mute); margin-top:auto; padding-top:6px;}

  .sectionTitle{font-size:13.5px; font-weight:600; margin:0 0 10px; color:var(--text);}
  .empty{
    text-align:center; padding:40px 16px; color:var(--text-sub); font-size:13.5px;
    border:1px dashed var(--border); border-radius:14px;
  }

  .donutCard{background:var(--card-bg); border:1px solid var(--card-border); border-radius:14px; padding:14px; margin-bottom:12px; backdrop-filter:var(--card-blur); -webkit-backdrop-filter:var(--card-blur);}
  .donutCard .head{margin-bottom:12px;}
  .donutRow{display:flex; align-items:center; gap:16px;}
  .donutWrap{position:relative; width:92px; height:92px; flex-shrink:0;}
  .donutWrap .ring{width:100%; height:100%; border-radius:50%; -webkit-mask:radial-gradient(farthest-side, transparent 57.5%, #000 58%); mask:radial-gradient(farthest-side, transparent 57.5%, #000 58%);}
  .donutWrap .hole{
    position:absolute; inset:21%; border-radius:50%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .donutWrap .hole .num{font-size:16px; font-weight:700; color:var(--text); line-height:1;}
  .donutWrap .hole .lab{font-size:9px; color:var(--text-mute); margin-top:2px;}
  .legend{flex:1; min-width:0; display:flex; flex-direction:column; gap:7px;}
  .legend .item{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-sub);}
  .legend .item .pn{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .legend .dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .legend .item b{color:var(--text); font-weight:600; flex-shrink:0; white-space:nowrap;}

  #formSection, #eventFormSection{
    display:none; background:rgba(255,255,255,0.78); border:0.5px solid var(--border);
    border-radius:14px; padding:16px; margin-bottom:22px; backdrop-filter:blur(6px);
  }
  #formSection.open, #eventFormSection.open{display:block;}
  #formSection h2, #eventFormSection h2{font-size:14px; font-weight:600; margin:0 0 12px;}
  .field{margin-bottom:10px;}
  .field label{display:block; font-size:12px; color:var(--text-sub); margin-bottom:4px;}
  .field input{
    width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:8px;
    font-size:14px; color:var(--text); background:rgba(255,255,255,0.58);
  }
  .field input:focus{outline:none; border-color:var(--text-mute);}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .dateGroup{display:flex; align-items:center; gap:4px;}
  .dateGroup input{
    width:auto; flex:1; min-width:0; text-align:center;
    padding:9px 4px; border:1px solid var(--border); border-radius:8px;
    font-size:14px; color:var(--text); background:rgba(255,255,255,0.58);
  }
  .dateGroup input.dy{flex:1.3;}
  .dateGroup span{color:var(--text-mute); font-size:13px; flex-shrink:0;}
  .dateGroup.mini input{padding:6px 3px; font-size:12px;}
  .formBtns{display:flex; gap:8px; margin-top:14px;}
  .formBtns button{
    flex:1; padding:10px; border-radius:9px; font-size:13.5px; font-weight:600; cursor:pointer; border:none;
  }
  .btnPrimary{background:var(--text); color:#fff;}
  .btnGhost{background:var(--plain-bg); color:var(--text-sub);}
  .err{font-size:12px; color:var(--danger); margin-top:2px; display:none;}

  .filterRow{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
  .chip{border:1px solid var(--border); background:#fff; color:var(--text-sub); font-size:12.5px; font-weight:600; padding:6px 12px; border-radius:20px; cursor:pointer;}
  .chip.active{background:var(--text); color:#fff; border-color:var(--text);}

  .setRow{border:1px dashed var(--border); border-radius:10px; padding:10px 10px 4px; margin-bottom:10px; background:rgba(255,255,255,0.4);}
  .setRow .miniBtn{margin-bottom:8px;}
  #f_isSet{accent-color:var(--purple-bg);}  /* SET 배지 배경색과 동일 */
  .btnAddOption{background:var(--cream); border:none; border-radius:9px; padding:10px; font-size:13.5px; font-weight:600; cursor:pointer;}  /* 저장 버튼과 같은 모양 */
  .setBadge{font-size:9.5px; font-weight:700; color:var(--purple-tx); background:var(--purple-bg); padding:2px 6px; border-radius:6px; flex-shrink:0; display:inline-block;}

  .brandCard{border-radius:14px; overflow:hidden; border:0.5px solid var(--border); margin-bottom:12px;}
  .brandHead{display:flex; align-items:center; gap:10px; padding:13px 14px; cursor:pointer;}
  .brandHead .chevB{font-size:11px; opacity:.6; margin-left:2px;}
  .orderBtns{display:flex; gap:6px;}
  .orderBtn{border:none; background:rgba(255,255,255,0.6); color:inherit; border-radius:8px; padding:5px 11px; font-size:13px; cursor:pointer;}
  .orderBtn:disabled{opacity:.35; cursor:default;}
  .chipRow{display:flex; flex-wrap:wrap; gap:6px;}
  .sChip{border:none; font-size:12px; padding:5px 11px; border-radius:16px; cursor:pointer; background:var(--cream); color:var(--blue-tx);}
  .brandChip{border:none; font-size:11.5px; padding:4px 10px; border-radius:14px; cursor:pointer;}
  .suggestBox{border:1px solid var(--border); background:#fff; border-radius:8px; margin-top:4px; max-height:190px; overflow-y:auto;}
  .suggestItem{display:flex; justify-content:space-between; gap:8px; padding:9px 10px; font-size:13px; cursor:pointer; border-top:0.5px solid var(--border);}
  .suggestItem:first-child{border-top:none;}
  .suggestItem:active{background:var(--cream);}
  .suggestItem small{color:var(--text-sub); font-size:12px; flex-shrink:0;}
  .listHead{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .listHeadBtns{display:flex; gap:6px;}
  .miniPill{border:none; background:var(--plain-bg); color:var(--text-sub); font-size:12px; font-weight:600; padding:5px 11px; border-radius:14px; cursor:pointer;}
  .miniPill.on{background:var(--add-btn-bg); color:var(--add-btn-text);}
  .brandHead .name{flex:1; min-width:0;}
  .brandHead .name p.n{font-size:14.5px; font-weight:600; margin:0;}
  .brandHead .name p.c{font-size:11px; margin:2px 0 0; opacity:.75;}
  .brandHead .total{font-size:13.5px; font-weight:600;}
  .bh1{background:var(--coral-bg); color:var(--coral-tx);}
  .bh2{background:var(--blue-bg); color:var(--blue-tx);}
  .bh3{background:var(--purple-bg); color:var(--purple-tx);}
  .bh4{background:var(--pink-bg); color:var(--pink-tx);}
  .bh5{background:var(--amber-bg); color:var(--amber-tx);}
  .bh6{background:var(--honey-bg); color:var(--honey-tx);}

  .productList{background:rgba(255,255,255,0.78); padding:0 14px; backdrop-filter:blur(6px);}

  .productGroup{padding:10px 0; border-bottom:0.5px solid var(--border);}
  .productGroup:last-child{border-bottom:none;}
  .productGroupHead{margin-bottom:2px;}
  .productGroupHead .gn{font-size:13.5px; font-weight:600; margin:0;}
  .productGroupHead .gc{font-size:11px; font-weight:400; color:var(--text-sub); margin-left:4px;}
  .hl{
    background: rgba(244,202,216,0.75);
    padding:1px 5px 2px;
    border-radius:3px 9px 3px 9px;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }

  .batch{padding:8px 0; border-bottom:0.5px dashed var(--border);}
  .batch:last-child{border-bottom:none;}
  .batchHead{display:flex; align-items:center; gap:8px;}
  .batchHead .bi{flex:1; min-width:0; cursor:pointer;}
  .batchHead .bi p{margin:0;}
  .batchHead .bi p.bcount{font-size:12.5px; font-weight:600; color:var(--text);}
  .batchHead .bi p.bmeta{font-size:11px; color:var(--text-sub); margin-top:2px; line-height:1.5;}
  .batchHead .actions{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .batchHead .actions button{border:none; background:none; color:var(--text-mute); font-size:11px; cursor:pointer;}
  .batchHead .actions button:hover{color:var(--text-sub);}
  .batchHead .chev{font-size:10px; color:var(--text-mute); flex-shrink:0;}

  .unitList{margin-top:8px; padding-left:10px; border-left:2px solid var(--border);}
  .unit{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 0;}
  .unit.done{opacity:.55;}
  .unit .ul{font-size:11.5px; color:var(--text-sub);}
  .unit .ur{display:flex; align-items:center; gap:6px; flex-shrink:0;}
  .statusBadge{font-size:10px; padding:3px 7px; border-radius:8px; font-weight:600; white-space:nowrap;}
  .statusBadge.unopened{background:var(--plain-bg); color:var(--plain-tx);}
  .statusBadge.inuse{background:var(--amber-bg); color:var(--amber-tx);}
  .statusBadge.used{background:#EFEAE3; color:#A79C8C;}
  .miniBtn{border:none; background:none; font-size:10.5px; color:var(--text-mute); cursor:pointer; padding:0;}
  .miniBtn:hover{color:var(--text-sub);}
  .miniBtn.del:hover{color:var(--danger);}

  .inlineDateForm{display:flex; align-items:center; gap:6px; margin:6px 0; flex-wrap:wrap; max-width:100%;}
  .inlineDateForm .dateGroup{flex:1 1 100%; width:100%; max-width:100%;}
  .inlineDateForm button{font-size:11px; padding:5px 9px; border-radius:6px; border:none; cursor:pointer; flex-shrink:0;}
  .inlineDateForm .ok{background:var(--text); color:#fff;}
  .inlineDateForm .no{background:var(--plain-bg); color:var(--text-sub);}
  .inlineDateForm .hintTxt{flex:1 1 100%; font-size:10.5px; color:var(--text-mute);}

  .calHead{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .calHead button{border:none; background:var(--cream); width:30px; height:30px; border-radius:8px; font-size:14px; cursor:pointer; color:var(--text-sub);}
  .calHead .ym{font-size:15px; font-weight:600;}
  .calGrid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:18px;}
  .calGrid .dow{text-align:center; font-size:11px; color:var(--text-mute); padding-bottom:4px;}
  .calCell{aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; border-radius:10px; cursor:pointer; font-size:12.5px; color:var(--text); background:#fff; border:1px solid var(--border);}
  .calCell.empty{visibility:hidden; cursor:default;}
  .calCell.today{border-color:var(--text-mute); font-weight:700;}
  .calCell.selected{background:var(--text); color:#fff; border-color:var(--text);}
  .calCell .dot{width:5px; height:5px; border-radius:50%; background:var(--coral-tx);}
  .calCell.selected .dot{background:#fff;}

  .eventItem{display:flex; justify-content:space-between; align-items:flex-start; gap:8px; padding:10px 0; border-bottom:0.5px solid var(--border);}
  .eventItem:last-child{border-bottom:none;}
  .eventItem .et .d{font-size:11px; color:var(--text-mute); margin:0 0 2px;}
  .eventItem .et .t{font-size:13.5px; font-weight:600; margin:0;}
  .eventItem .et .m{font-size:11.5px; color:var(--text-sub); margin:2px 0 0;}
  .eventItem .miniBtn{font-size:11px;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>내 화장품 컬렉션</h1>
      <p>브랜드 · 상품별 구매 기록</p>
    </div>
    <button id="mainAddBtn" onclick="onMainAddClick()">+ 추가</button>
  </header>

  <div class="tabbar">
    <button id="tabBtn_home" class="active" onclick="switchTab('home')"><span class="tabIco"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5 12 3l8.5 7.5V19a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 19z"/><path d="M9.5 20.5v-6h5v6"/></svg></span><span>홈</span></button>
    <button id="tabBtn_list" onclick="switchTab('list')"><span class="tabIco"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="4" cy="6" r="1" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1" fill="currentColor" stroke="none"/><path d="M9 6h12M9 12h12M9 18h12"/></svg></span><span>리스트</span></button>
    <button id="tabBtn_schedule" onclick="switchTab('schedule')"><span class="tabIco"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/><circle cx="8.5" cy="14" r=".8" fill="currentColor" stroke="none"/><circle cx="12" cy="14" r=".8" fill="currentColor" stroke="none"/><circle cx="15.5" cy="14" r=".8" fill="currentColor" stroke="none"/><circle cx="8.5" cy="17.2" r=".8" fill="currentColor" stroke="none"/><circle cx="12" cy="17.2" r=".8" fill="currentColor" stroke="none"/></svg></span><span>스케줄</span></button>
  </div>

  <!-- ===== 홈 탭 ===== -->
  <div id="panel_home" class="tabpanel active">
    <div class="stats" id="stats"></div>
    <p class="sectionTitle">미개봉 현황</p>
    <div id="unopenedGrid"></div>
  </div>

  <!-- ===== 리스트 탭 ===== -->
  <div id="panel_list" class="tabpanel">

    <div id="formSection">
      <h2 id="formTitle">화장품 추가</h2>
      <div class="field" id="freqWrap" style="display:none;">
        <label>자주 산 상품 (누르면 자동 입력)</label>
        <div class="chipRow" id="freqChips"></div>
      </div>
      <div class="field">
        <label>브랜드</label>
        <input type="text" id="f_brand" placeholder="예: 무무키" oninput="refreshSuggest()">
        <div class="chipRow" id="brandChips" style="margin-top:6px;"></div>
      </div>

      <div class="field" id="setToggleField">
        <label style="display:flex; align-items:center; gap:8px; cursor:pointer; margin-bottom:0;">
          <input type="checkbox" id="f_isSet" onchange="toggleSetMode()" style="width:auto;">
          세트로 구매 (본품+리필 등 여러 품목을 한 번에)
        </label>
      </div>

      <div id="singleModeFields">
        <div class="field">
          <label>제품명</label>
          <input type="text" id="f_name" placeholder="브랜드를 고르면 목록이 떠요 / 직접 입력도 가능" oninput="refreshSuggest()">
          <div class="suggestBox" id="prodSuggest" style="display:none;"></div>
        </div>
        <div class="field">
          <label>옵션 (선택 — 예: 본품, 리필)</label>
          <input type="text" id="f_option1" placeholder="예: 리필">
        </div>
        <div class="field">
          <label>구매일</label>
          <div class="dateGroup">
            <input type="text" id="f_date_y" class="dy" maxlength="4" inputmode="numeric" placeholder="YYYY">
            <span>.</span>
            <input type="text" id="f_date_m" maxlength="2" inputmode="numeric" placeholder="MM">
            <span>.</span>
            <input type="text" id="f_date_d" maxlength="2" inputmode="numeric" placeholder="DD">
          </div>
        </div>
        <div class="row2">
          <div class="field">
            <label>정상가 (개당)</label>
            <input type="number" id="f_regular" placeholder="32000">
          </div>
          <div class="field">
            <label>구매금액 (총 결제금액)</label>

function fmt(n){ return Math.round(n).toLocaleString('ko-KR') + '원'; }
function discountPct(regular, paid){
  if(!regular || regular <= 0) return 0;
  return Math.round((1 - (paid / regular)) * 100);
}
function colorFor(brand){
  const brands = [...new Set(units.map(u => u.brand))];   // 등록된 순서 기준 → 순서 편집해도 색 고정

function escapeHtml(s){

/* ---- 날짜 3분할 입력 (연4자리 → 자동 월 이동) ---- */
function bindDateGroup(prefix){
  const y = document.getElementById(prefix+'_y');
  const m = document.getElementById(prefix+'_m');
  const d = document.getElementById(prefix+'_d');
  if(!y || !m || !d) return;
  y.addEventListener('input', () => {
    y.value = y.value.replace(/\D/g,'').slice(0,4);
    if(y.value.length === 4) m.focus();
  });
  m.addEventListener('input', () => {
    m.value = m.value.replace(/\D/g,'').slice(0,2);
    if(m.value.length === 2) d.focus();
  });
  d.addEventListener('input', () => {
    d.value = d.value.replace(/\D/g,'').slice(0,2);
  });
}
function getDateValue(prefix){
  const y = document.getElementById(prefix+'_y').value;
  const m = document.getElementById(prefix+'_m').value;
  const d = document.getElementById(prefix+'_d').value;
  if(!y && !m && !d) return {status:'empty', value:''};
  if(y.length === 4 && m.length >= 1 && d.length >= 1){
    return {status:'ok', value: `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`};
  }
  return {status:'incomplete', value:''};
}
function setDateValue(prefix, iso){
  const y = document.getElementById(prefix+'_y');
  const m = document.getElementById(prefix+'_m');
  const d = document.getElementById(prefix+'_d');
  if(iso){
    const [yy,mm,dd] = iso.split('-');
    y.value = yy; m.value = mm; d.value = dd;
  }else{
    y.value = ''; m.value = ''; d.value = '';
  }
}

/* ---- 좌우 스와이프로 탭 전환 (폰/태블릿) ---- */
const TAB_ORDER = ['home','list','schedule'];
let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
document.addEventListener('touchstart', e => {
  if(e.touches.length !== 1) return;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  touchStartTime = Date.now();
}, {passive:true});
document.addEventListener('touchend', e => {
  if(!touchStartX) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  const dt = Date.now() - touchStartTime;
  touchStartX = 0;
  if(dt > 600) return;                 // 너무 느리면 스와이프로 안 봄
  if(Math.abs(dx) < 60) return;        // 이동 거리가 짧으면 무시
  if(Math.abs(dx) < Math.abs(dy) * 1.3) return; // 세로 스크롤이면 무시
  const idx = TAB_ORDER.indexOf(activeTab);
  if(dx < 0 && idx < TAB_ORDER.length - 1) switchTab(TAB_ORDER[idx + 1]); // 왼쪽으로 밀기 → 다음 탭
  else if(dx > 0 && idx > 0) switchTab(TAB_ORDER[idx - 1]);               // 오른쪽으로 밀기 → 이전 탭
}, {passive:true});

function saveUnit(){
  if(formMode === 'add' && document.getElementById('f_isSet').checked){
    saveSetUnits();
    return;
  }

  const brand = document.getElementById('f_brand').value.trim();
  const name = document.getElementById('f_name').value.trim();
  const option1 = document.getElementById('f_option1').value.trim();
  const store = document.getElementById('f_store').value.trim();
  const totalPaid = parseFloat(document.getElementById('f_paid').value);
  const regular = parseFloat(document.getElementById('f_regular').value);
  const qty = Math.max(1, parseInt(document.getElementById('f_qty').value) || 1);
  const dateRes = getDateValue('f_date');
  const expiryRes = getDateValue('f_expiry');

  const valid = brand && name && dateRes.status === 'ok' &&
    !isNaN(regular) && regular > 0 && !isNaN(totalPaid) && totalPaid >= 0 &&
    expiryRes.status !== 'incomplete';

  if(!valid){
    document.getElementById('formErr').style.display = 'block';
    return;
  }
  document.getElementById('formErr').style.display = 'none';

  const perUnitPaid = Math.round(totalPaid / qty);

  const base = {
    brand, name, option1, store,
    purchaseDate: dateRes.value,
    regular, paid: perUnitPaid,
    expiry: expiryRes.value,
    setName: ''
  };

  let finalGroup;
  if(formMode === 'edit' && editingBatchIds && editingBatchIds.length){
    let group = editingBatchIds.map(id => units.find(u => u.id === id)).filter(Boolean);
    const wasSet = group.some(u => u.isSet || u.setName);   // 세트로 입력한 묶음이면 수정해도 세트 유지
    group.forEach(u => { Object.assign(u, base); if(wasSet) u.isSet = true; });

    const diff = qty - group.length;
    if(diff > 0){
      for(let i=0; i<diff; i++){
        const nu = { id: genId(), ...base, status:'unopened', openDate:'', finishDate:'' };
        if(wasSet) nu.isSet = true;
        units.push(nu);
        group.push(nu);
      }
    }else if(diff < 0){
      const removeCount = -diff;
      const pool = [
        ...group.filter(u => u.status === 'unopened'),
        ...group.filter(u => u.status === 'inuse'),
        ...group.filter(u => u.status === 'used')
      ];
      const toRemove = new Set(pool.slice(0, removeCount).map(u => u.id));
      units = units.filter(u => !toRemove.has(u.id));
      group = group.filter(u => !toRemove.has(u.id));
    }
    finalGroup = group;
  }else{
    finalGroup = [];
    for(let i=0; i<qty; i++){
      const nu = { id: genId(), ...base, status: 'unopened', openDate: '', finishDate: '' };
      units.push(nu);
      finalGroup.push(nu);
    }
  }

  // 반올림 오차는 마지막 낱개에서 흡수해서 합계를 입력한 총 결제금액과 정확히 맞춤
  const sumPaid = finalGroup.reduce((s,u) => s + u.paid, 0);
  if(finalGroup.length) finalGroup[finalGroup.length - 1].paid += (totalPaid - sumPaid);

  expandedBrands.add(brand); saveExpandedBrands();
  persistUnits();
  closeForm();
  render();
}
function saveSetUnits(){
  const brand = document.getElementById('f_brand').value.trim();
  const store = document.getElementById('f_setStore').value.trim();
  const totalPaid = parseFloat(document.getElementById('f_setTotalPaid').value);
  const dateRes = getDateValue('f_set_date');
  const expiryRes = getDateValue('f_set_expiry');

  const rows = setRowIds.map(idx => ({
    name: document.getElementById('setRowProduct_'+idx).value.trim(),
    option1: document.getElementById('setRowOption_'+idx).value.trim(),
    regular: parseFloat(document.getElementById('setRowRegular_'+idx).value),
    qty: Math.max(1, parseInt(document.getElementById('setRowQty_'+idx).value) || 1)
  })).filter(r => r.name);

  const valid = brand && dateRes.status === 'ok' &&
    !isNaN(totalPaid) && totalPaid >= 0 && expiryRes.status !== 'incomplete' &&
    rows.length > 0 && rows.every(r => !isNaN(r.regular) && r.regular > 0);

  if(!valid){
    document.getElementById('formErr').style.display = 'block';
    return;
  }
  document.getElementById('formErr').style.display = 'none';

  const grandRegularSum = rows.reduce((s,r) => s + r.regular * r.qty, 0);
  const planned = [];
  rows.forEach(r => {
    const rowShare = grandRegularSum > 0 ? totalPaid * (r.regular * r.qty) / grandRegularSum : 0;
    const perUnitPaid = Math.round(rowShare / r.qty);
    for(let i=0; i<r.qty; i++) planned.push({name: r.name, option1: r.option1, regular: r.regular, paid: perUnitPaid});
  });
  // 반올림 오차는 마지막 낱개에서 흡수해서 합계를 세트 총액과 정확히 맞춤
  const sumPlanned = planned.reduce((s,p) => s + p.paid, 0);
  if(planned.length) planned[planned.length - 1].paid += (totalPaid - sumPlanned);

  planned.forEach(p => {
    units.push({
      id: genId(),
      brand, name: p.name, option1: p.option1, store,
      purchaseDate: dateRes.value,
      regular: p.regular, paid: p.paid,
      expiry: expiryRes.value,
      isSet: true,
      status: 'unopened', openDate: '', finishDate: ''
    });
  });

  expandedBrands.add(brand); saveExpandedBrands();
  persistUnits();
  closeForm();
  render();
}

function startOpen(id){ openingUnitId = id; finishingUnitId = null; render(); }
function cancelOpen(){ openingUnitId = null; render(); }
function confirmOpen(id){

  if(res.status === 'incomplete') return;   // 비우거나 끝까지 입력하면 저장, 일부만 입력하면 막음

  openingUnitId = null;
  persistUnits(); render();
}
function startFinish(id){ finishingUnitId = id; openingUnitId = null; render(); }
function cancelFinish(){ finishingUnitId = null; render(); }
function confirmFinish(id){
  const res = getDateValue('finish_'+id);
  if(res.status === 'incomplete') return;
  const u = units.find(x => x.id === id);

}

function renderStats(){
  let totalSpent = 0, totalSaved = 0, discSum = 0, discCount = 0;
  units.forEach(u => {
    totalSpent += u.paid;
    const saved = u.regular - u.paid;
    if(saved > 0) totalSaved += saved;
    const d = discountPct(u.regular, u.paid);
    if(d > 0){ discSum += d; discCount++; }
  });
  const avgDisc = discCount ? Math.round(discSum / discCount) : 0;

  const monthPrefix = todayIso.slice(0,7);
  const monthUnits = units.filter(u => u.purchaseDate && u.purchaseDate.startsWith(monthPrefix));
  const monthCount = monthUnits.length;
  const monthSpent = monthUnits.reduce((s,u) => s + u.paid, 0);
  const salePct = units.length ? Math.round(discCount / units.length * 100) : 0;
  const mostRecent = units.reduce((max,u) => (!max || u.purchaseDate > max) ? u.purchaseDate : max, '');

  const stats = [
    {cls:'c1', ico:'₩', txt:true, lbl:'총 지출', val: fmt(totalSpent),
      delta: monthCount ? `이번 달 +${fmt(monthSpent)}` : '이번 달 구매 없음'},
    {cls:'c2', ico:ICO_BAG, lbl:'보유 제품 수', val: units.length + '개',
      delta: monthCount ? `이번 달 +${monthCount}개` : '이번 달 추가 없음'},
    {cls:'c3', ico:ICO_TAG, lbl:'세일로 절약한 금액', val: fmt(totalSaved),
      delta: `세일 구매 비중 ${salePct}%`},
    {cls:'c4', ico:ICO_PERCENT, lbl:'평균 할인율', val: avgDisc + '%',
      delta: mostRecent ? `최근 구매일 ${dispDate(mostRecent)}` : '구매 기록 없음'}
  ];
  document.getElementById('stats').innerHTML = stats.map(s => `
    <div class="stat ${s.cls}">
      <div class="icoWrap ${s.txt?'txt':''}">${s.ico}</div>
      <p class="lbl">${s.lbl}</p>
      <p class="val">${s.val}</p>
      <p class="delta">${s.delta}</p>
    </div>`).join('');
}

  const brandOrder = getFullBrandOrder().filter(b => b in byBrand);

  el.innerHTML = brandOrder.map(brand => {
    const items = byBrand[brand];
    const total = items.length;
    const byProduct = {};
    items.forEach(u => { const key = u.name; byProduct[key] = (byProduct[key] || 0) + 1; });
    const products = Object.keys(byProduct)
      .map(name => ({name, count: byProduct[name]}))
      .sort((a,b) => b.count - a.count);

    const gradStr = products.map((p,i) => {
      const pct = p.count / total * 100;
      const color = DONUT_PALETTE[i % DONUT_PALETTE.length];
      const part = `${color} ${cum.toFixed(2)}% ${(cum+pct).toFixed(2)}%`;

    const legendHtml = products.map((p,i) => {

/* ---- 자동 입력 도우미 (자주 산 상품 · 브랜드 → 제품 → 정상가) ---- */
let suggestEnabled = false;   // 추가 폼일 때만 사용 (수정/복사 폼에선 끔)
let suggestBrands = [], suggestProducts = [], suggestSets = [], freqList = [];

function buildProductIndex(brand){   // 해당 브랜드 제품(옵션별) + 가장 최근 정상가
  const m = {};
  units.filter(u => u.brand === brand).forEach(u => {
    const key = u.name + '|' + (u.option1 || '');
    if(!m[key] || u.purchaseDate > m[key].date) m[key] = {name:u.name, option1:u.option1 || '', regular:u.regular, date:u.purchaseDate};
  });
  return Object.values(m).sort((a,b) => b.date.localeCompare(a.date));
}
function buildFrequent(){   // 구매한 날짜 수가 많은 순으로 상위 6개
  const m = {};
  units.forEach(u => {
    const key = u.brand + '|' + u.name + '|' + (u.option1 || '');
    const e = m[key] || (m[key] = {brand:u.brand, name:u.name, option1:u.option1 || '', regular:u.regular, date:u.purchaseDate, dates:new Set()});
    e.dates.add(u.purchaseDate);
    if(u.purchaseDate > e.date){ e.date = u.purchaseDate; e.regular = u.regular; }
  });
  return Object.values(m).sort((a,b) => b.dates.size - a.dates.size || b.date.localeCompare(a.date)).slice(0, 6);
}
function buildSetIndex(brand){   // 이전에 세트로 산 구성(옵션·정상가·수량)
  const m = {};
  units.filter(u => u.brand === brand && (u.isSet || u.setName)).forEach(u => { (m[u.name] = m[u.name] || []).push(u); });
  return Object.keys(m).map(name => {
    const byOpt = {};
    m[name].forEach(u => { (byOpt[u.option1 || ''] = byOpt[u.option1 || ''] || []).push(u); });
    const comps = Object.keys(byOpt).map(opt => {
      const arr = byOpt[opt];
      const latest = arr.reduce((mx,u) => u.purchaseDate > mx ? u.purchaseDate : mx, '');
      const latestArr = arr.filter(u => u.purchaseDate === latest);
      return {option1:opt, regular:latestArr[0].regular, qty:latestArr.length, date:latest};
    });
    return {name, comps, date: comps.reduce((mx,c) => c.date > mx ? c.date : mx, '')};
  }).sort((a,b) => b.date.localeCompare(a.date));
}
function refreshSuggest(){
  const $ = id => document.getElementById(id);
  const hideAll = () => {
    $('freqWrap').style.display = 'none'; $('brandChips').innerHTML = '';
    $('prodSuggest').style.display = 'none'; $('prodSuggest').innerHTML = '';
    $('setSuggestWrap').style.display = 'none'; $('setSuggest').innerHTML = '';
  };
  if(!suggestEnabled){ hideAll(); return; }
  const isSet = $('f_isSet').checked;
  const typed = $('f_brand').value.trim().toLowerCase();
  const allBrands = getFullBrandOrder();

  // 자주 산 상품 칩 (일반 구매 입력일 때만)
  if(!isSet){
    freqList = buildFrequent();
    $('freqChips').innerHTML = freqList.map((p,i) =>
      `<button type="button" class="sChip" onclick="pickFreq(${i})">${escapeHtml(p.brand)} · ${escapeHtml(p.name)}${p.option1 ? ' ' + escapeHtml(p.option1) : ''}</button>`).join('');
    $('freqWrap').style.display = freqList.length ? 'block' : 'none';
  }else{
    $('freqWrap').style.display = 'none';
  }

  // 브랜드 칩
  suggestBrands = allBrands.filter(b => b.toLowerCase().includes(typed));
  $('brandChips').innerHTML = suggestBrands.map((b,i) =>
    `<button type="button" class="brandChip ${colorFor(b)}" onclick="pickBrand(${i})">${escapeHtml(b)}</button>`).join('');

  const exact = allBrands.find(b => b.toLowerCase() === typed);

  // 제품명 목록 (일반 구매)
  const ps = $('prodSuggest');
  if(!isSet && exact){
    const q = $('f_name').value.trim().toLowerCase();
    suggestProducts = buildProductIndex(exact).filter(p => !q || p.name.toLowerCase().includes(q));
    ps.innerHTML = suggestProducts.map((p,i) =>
      `<div class="suggestItem" onclick="pickProduct(${i})"><span>${escapeHtml(p.name)}${p.option1 ? ' · ' + escapeHtml(p.option1) : ''}</span><small>정상가 ${fmt(p.regular)}</small></div>`).join('');
    ps.style.display = suggestProducts.length ? 'block' : 'none';
  }else{
    ps.style.display = 'none'; ps.innerHTML = '';
  }

  // 이전 세트 불러오기 (세트 구매)
  if(isSet && exact){
    suggestSets = buildSetIndex(exact);
    $('setSuggest').innerHTML = suggestSets.map((st,i) =>
      `<button type="button" class="sChip" onclick="pickSet(${i})">${escapeHtml(st.name)} · ${st.comps.map(c => escapeHtml(c.option1 || '기본')).join(' + ')}</button>`).join('');
    $('setSuggestWrap').style.display = suggestSets.length ? 'block' : 'none';
  }else{
    $('setSuggestWrap').style.display = 'none'; $('setSuggest').innerHTML = '';
  }
}
function pickBrand(i){
  const b = suggestBrands[i]; if(b === undefined) return;
  document.getElementById('f_brand').value = b;
  refreshSuggest();
}
function pickProduct(i){
  const p = suggestProducts[i]; if(!p) return;
  document.getElementById('f_name').value = p.name;
  document.getElementById('f_option1').value = p.option1;
  document.getElementById('f_regular').value = p.regular;
  document.getElementById('prodSuggest').style.display = 'none';
  document.getElementById('f_paid').focus();
}
function pickFreq(i){
  const p = freqList[i]; if(!p) return;
  document.getElementById('f_brand').value = p.brand;
  document.getElementById('f_name').value = p.name;
  document.getElementById('f_option1').value = p.option1;
  document.getElementById('f_regular').value = p.regular;
  refreshSuggest();
  document.getElementById('prodSuggest').style.display = 'none';
  document.getElementById('f_paid').focus();
}
function pickSet(i){
  const st = suggestSets[i]; if(!st) return;
  document.getElementById('setRows').innerHTML = '';
  setRowIds = [];
  st.comps.forEach(c => {
    addSetRow();
    const idx = setRowIds[setRowIds.length - 1];
    document.getElementById('setRowProduct_' + idx).value = st.name;
    document.getElementById('setRowOption_' + idx).value = c.option1;
    document.getElementById('setRowRegular_' + idx).value = c.regular;
    document.getElementById('setRowQty_' + idx).value = c.qty;
  });
  document.getElementById('f_setTotalPaid').focus();
}

/* ---- 브랜드 순서 · 접기/펼치기 ---- */
let brandOrderList = [];      // 내가 정한 브랜드 순서 (jsonbin에 저장)
let brandEditMode = false;    // 순서 편집 중인지
let renderedBrandOrder = [];  // 현재 화면에 그려진 브랜드 순서
const expandedBrands = new Set();  // 펼쳐둔 브랜드 (이 기기에 기억, 처음엔 모두 접힘)
const EXPANDED_KEY = 'cosmetic_item_expanded_brands';
try{ JSON.parse(localStorage.getItem(EXPANDED_KEY) || '[]').forEach(b => expandedBrands.add(b)); }catch(e){}
function saveExpandedBrands(){ try{ localStorage.setItem(EXPANDED_KEY, JSON.stringify([...expandedBrands])); }catch(e){} }

function getFullBrandOrder(){
  const totals = {};
  units.forEach(u => { totals[u.brand] = (totals[u.brand] || 0) + u.paid; });
  const known = brandOrderList.filter(b => b in totals);
  const rest = Object.keys(totals).filter(b => !known.includes(b)).sort((a,b) => totals[b] - totals[a]);
  return [...known, ...rest];   // 새 브랜드는 맨 아래에 붙음
}
function toggleBrand(i){
  if(brandEditMode) return;
  const b = renderedBrandOrder[i];
  if(b === undefined) return;
  if(expandedBrands.has(b)) expandedBrands.delete(b); else expandedBrands.add(b);
  saveExpandedBrands(); render();
}
function toggleAllBrands(){
  const anyOpen = renderedBrandOrder.some(b => expandedBrands.has(b));
  renderedBrandOrder.forEach(b => anyOpen ? expandedBrands.delete(b) : expandedBrands.add(b));
  saveExpandedBrands(); render();
}
function toggleBrandEdit(){ brandEditMode = !brandEditMode; render(); }
function moveBrand(i, dir){
  const a = renderedBrandOrder[i], b = renderedBrandOrder[i + dir];
  if(a === undefined || b === undefined) return;
  const full = getFullBrandOrder();
  const ia = full.indexOf(a), ib = full.indexOf(b);
  [full[ia], full[ib]] = [full[ib], full[ia]];
  brandOrderList = full;
  persistAll(); render();
}
function renderBrandHead(){
  const el = document.getElementById('listHeadBtns');
  if(!el) return;
  const anyOpen = renderedBrandOrder.some(b => expandedBrands.has(b));
  el.innerHTML = (brandEditMode ? '' : `<button class="miniPill" onclick="toggleAllBrands()">${anyOpen ? '모두 접기' : '모두 펼치기'}</button>`) +
    `<button class="miniPill ${brandEditMode ? 'on' : ''}" onclick="toggleBrandEdit()">${brandEditMode ? '완료' : '순서 편집'}</button>`;
}

const expandedBatches = new Set();
function toggleBatch(batchId){
  if(expandedBatches.has(batchId)) expandedBatches.delete(batchId);
  else expandedBatches.add(batchId);
  render();
}

function renderUnitRow(u, label, showCopy){
  const statusLabel = {unopened:'미개봉', inuse:'사용중', used:'다씀'}[u.status];
  const isDone = u.status === 'used';

  let actionHtml = '';
  if(openingUnitId === u.id){
    actionHtml = `<div class="inlineDateForm">${dateGroupHtml('open_'+u.id)}
      <button class="ok" onclick="confirmOpen('${u.id}')">확인</button>
      <button class="no" onclick="cancelOpen()">취소</button><span class="hintTxt">날짜를 몰라도 비워둔 채 확인하면 저장돼요</span></div>`;
  }else if(finishingUnitId === u.id){
    actionHtml = `<div class="inlineDateForm">${dateGroupHtml('finish_'+u.id)}
      <button class="ok" onclick="confirmFinish('${u.id}')">확인</button>
      <button class="no" onclick="cancelFinish()">취소</button><span class="hintTxt">날짜를 몰라도 비워둔 채 확인하면 저장돼요</span></div>`;
  }

  let statusBtn = '';
  if(u.status === 'unopened') statusBtn = `<button class="miniBtn" onclick="startOpen('${u.id}')">사용 시작</button>`;
  else if(u.status === 'inuse') statusBtn = `<button class="miniBtn" onclick="startFinish('${u.id}')">다 썼어요</button>`;

  const copyBtn = showCopy ? `<button class="miniBtn" onclick="openCopyForm('${u.id}')">복사</button>` : '';

  const dateInfo = u.status === 'used' ? `개봉 ${dispDate(u.openDate)} · 소진 ${dispDate(u.finishDate)}`
    : u.status === 'inuse' ? `개봉 ${dispDate(u.openDate)}` : '';

  return `
    <div class="unit ${isDone ? 'done':''}">
      <div class="ul">${label}${dateInfo ? ' · ' + dateInfo : ''}</div>
      <div class="ur">
        <span class="statusBadge ${u.status}">${statusLabel}</span>
        ${statusBtn}
        ${copyBtn}
        <button class="miniBtn del" onclick="deleteUnit('${u.id}')">삭제</button>
      </div>
    </div>
    ${actionHtml}`;
}
/* ===================== 스케줄 탭 ===================== */
function pad2(n){ return String(n).padStart(2,'0'); }

function navCal(delta){
  calViewMonth += delta;
  if(calViewMonth < 0){ calViewMonth = 11; calViewYear--; }
  if(calViewMonth > 11){ calViewMonth = 0; calViewYear++; }
  renderSchedule();
}

function renderSchedule(){
  document.getElementById('calYm').textContent = `${calViewYear}년 ${calViewMonth+1}월`;

  const firstDow = new Date(calViewYear, calViewMonth, 1).getDay();
  const daysInMonth = new Date(calViewYear, calViewMonth+1, 0).getDate();
  const dows = ['일','월','화','수','목','금','토'];

  const eventDates = new Set(events.map(e => e.date));

  let cells = dows.map(d => `<div class="dow">${d}</div>`).join('');
  for(let i=0; i<firstDow; i++) cells += `<div class="calCell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${calViewYear}-${pad2(calViewMonth+1)}-${pad2(d)}`;
    const isToday = iso === todayIso;
    const isSelected = iso === selectedDate;
    const hasEvent = eventDates.has(iso);
    cells += `<div class="calCell ${isToday?'today':''} ${isSelected?'selected':''}" onclick="selectDay('${iso}')">
      <span>${d}</span>${hasEvent ? '<span class="dot"></span>' : ''}
    </div>`;
  }
  document.getElementById('calGrid').innerHTML = cells;

  renderEventList();
}

function selectDay(iso){
  selectedDate = selectedDate === iso ? null : iso;
  renderSchedule();
}

function renderEventList(){
  const titleEl = document.getElementById('eventListTitle');
  const listEl = document.getElementById('eventList');

  let list, title;
  if(selectedDate){
    list = events.filter(e => e.date === selectedDate).sort((a,b) => a.date.localeCompare(b.date));
    title = `${dispDate(selectedDate)} 일정`;
  }else{
    const ymPrefix = `${calViewYear}-${pad2(calViewMonth+1)}`;
    list = events.filter(e => e.date.startsWith(ymPrefix)).sort((a,b) => a.date.localeCompare(b.date));
    title = '이달의 세일 일정';
  }
  titleEl.textContent = title;

  if(list.length === 0){
    listEl.innerHTML = '<div class="empty">등록된 세일 일정이 없어요.</div>';
    return;
  }
  listEl.innerHTML = list.map(e => `
    <div class="eventItem">
      <div class="et">
        <p class="d">${dispDate(e.date)}</p>
        <p class="t">${escapeHtml(e.title)}</p>
        ${e.memo ? `<p class="m">${escapeHtml(e.memo)}</p>` : ''}
      </div>
      <button class="miniBtn del" onclick="deleteEvent('${e.id}')">삭제</button>
    </div>`).join('');
}

function openEventForm(){
  editingEventId = null;
  document.getElementById('f_ev_title').value = '';
  document.getElementById('f_ev_memo').value = '';
  setDateValue('f_ev', selectedDate || '');
  document.getElementById('eventFormSection').classList.add('open');
}
function closeEventForm(){
  document.getElementById('eventFormSection').classList.remove('open');
  editingEventId = null;
}
function saveEvent(){
  const title = document.getElementById('f_ev_title').value.trim();
  const memo = document.getElementById('f_ev_memo').value.trim();
  const dateRes = getDateValue('f_ev');
  if(!title || dateRes.status !== 'ok'){
    document.getElementById('eventErr').style.display = 'block';
    return;
  }
  document.getElementById('eventErr').style.display = 'none';
  events.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,7), date: dateRes.value, title, memo });
  persistEvents();
  closeEventForm();
  renderSchedule();
}
function deleteEvent(id){
  events = events.filter(e => e.id !== id);
  persistEvents();
  renderSchedule();
}

loadAll();
</script>
