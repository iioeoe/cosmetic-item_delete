<style>
  :root {
    --bg: #fffafa;
    --app-bg: #f5ece3;
    --card: #ffffff;
    --accent: #EBA5A7;
    --accent-dark: #d48a8c;
    --accent-light: #f7d5d6;
    --text: #3f3f3f;
    --text2: #5a5959;
    --border: #e8e8e8;
    --radius: 10px;
    --tag-bg: #fde8ed;
    --tag-text: #c0606a;
    --in-use-bg: #c6e1ed;
    --in-use-text: #9ac1d2;
    --expired-bg: #fdeaea;
    --expired-text: #b04040;
    --soon-text: #e6a800;
    --app-width: 480px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; font-family: 'Nanum Gothic', sans-serif; background: var(--app-bg); }
  body { display: flex; justify-content: center; align-items: flex-start; }

  #app {
    width: 100%; max-width: var(--app-width); min-height: 100vh;
    background: var(--bg); position: relative;
    box-shadow: 0 0 40px rgba(0,0,0,0.13);
    display: flex; flex-direction: column; overflow-x: hidden;
    padding-bottom: 70px;
  }

  .btn {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 7px 14px; font-family: 'Nanum Gothic', sans-serif; font-size: 0.8rem;
    font-weight: 700; cursor: pointer; display: inline-flex; align-items: center;
    gap: 4px; transition: background 0.15s, transform 0.1s;
  }
  .btn:active { transform: scale(0.96); background: var(--accent-dark); }
  .btn:hover  { background: var(--accent-dark); }

<script>
// ══════════════════════════════
// JSONBin 설정
// ══════════════════════════════
const BIN_ID  = '6a30d7f6f5f4af5e29f929dd';
const API_KEY = '$2a$10$5M47Az7zQLXRpS/JJrVwYOwsPFBF2JU7s/HmOmDUY52nOqVH9qR3O';
const BIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

// ══════════════════════════════
// 로컬 스토리지 (오프라인 캐시)
// ══════════════════════════════
const STORAGE_KEY = 'cosmeticTracker_v1';
function loadLocal() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || getDefaultData(); }
  catch { return getDefaultData(); }
}
function saveLocal(d) { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }
function getDefaultData() { return { brands: [], items: [] }; }

let data = loadLocal();
let currentProductBrand = data.brands[0] || '';
let currentStockFilter  = 'all';
let editItemId   = null;
let useItemId    = null;
let doneItemId   = null;
let editBrandIdx = null;
let isSyncing    = false;

// ══════════════════════════════
// 동기화 상태 표시
// ══════════════════════════════
function setSyncStatus(status, text) {
  const dot  = document.getElementById('syncDot');
  const label = document.getElementById('syncText');
  if (!dot || !label) return;
  dot.className = 'sync-dot ' + status;
  label.textContent = text;
}

// ══════════════════════════════
// 클라우드에서 불러오기
// ══════════════════════════════
async function syncFromCloud(showFeedback = false) {
  if (isSyncing) return;
  isSyncing = true;
  setSyncStatus('loading', '불러오는 중...');
  try {
    const res = await fetch(BIN_URL + '/latest', {
      headers: { 'X-Master-Key': API_KEY }
    });
    if (!res.ok) throw new Error('fetch fail');
    const json = await res.json();
    const record = json.record;
    if (record && record.items !== undefined) {
      data = record;
      saveLocal(data);
      if (!currentProductBrand || !data.brands.includes(currentProductBrand)) {
        currentProductBrand = data.brands[0] || '';
      }
      render();
    }
    const now = new Date().toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'});
    setSyncStatus('ok', `동기화 완료 ${now}`);
  } catch(e) {
    setSyncStatus('error', '동기화 실패 (오프라인)');
  } finally {
    isSyncing = false;
  }
}

// ══════════════════════════════
// 클라우드에 저장
// ══════════════════════════════
async function saveToCloud() {
  setSyncStatus('loading', '저장 중...');
  try {
    const res = await fetch(BIN_URL, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': API_KEY
      },
      body: JSON.stringify(data)
    });
    if (!res.ok) throw new Error('save fail');
    const now = new Date().toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'});
    setSyncStatus('ok', `저장 완료 ${now}`);
  } catch(e) {
    setSyncStatus('error', '저장 실패 (로컬만 저장됨)');
  }
}

// 저장: 로컬 + 클라우드
function saveData(d) {
  saveLocal(d);
  saveToCloud();
}

// ══════════════════════════════
// 탭 전환
// ══════════════════════════════
function switchTab(name, el) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  el.classList.add('active');
  if (name === 'home')    renderHome();
  if (name === 'brand')   renderBrandPage();
  if (name === 'product') renderProductTab();
  if (name === 'stock')   renderStockTab();
}

function render() {
  renderHome();
  renderBrandPage();
  renderProductTab();
  renderStockTab();
}

function today() { const d = new Date(); d.setHours(0,0,0,0); return d; }
function todayStr() { return new Date().toISOString().slice(0,10); }

// ══════════════════════════════
// 홈 탭
// ══════════════════════════════
function renderHome() {
  const td = today();
  const inStock = data.items.filter(i => i.status === 'in-stock').length;
  const inUse   = data.items.filter(i => i.status === 'in-use').length;
  const total   = data.items.length;
  const soon    = data.items.filter(i => {
    if (!i.expDate || i.status === 'used') return false;
    const diff = (new Date(i.expDate) - td) / 86400000;
    return diff >= 0 && diff <= 30;
  }).length;

  document.getElementById('heroTotal').innerHTML = `${inStock} <span>개</span>`;
  document.getElementById('heroMeta').innerHTML = soon > 0
    ? `<span style="background:rgba(255,255,255,0.25);border-radius:8px;padding:3px 10px;font-size:0.72rem;font-weight:700;">⚠️ 만료임박 ${soon}개</span>`
    : `<span style="background:rgba(255,255,255,0.2);border-radius:8px;padding:3px 10px;font-size:0.72rem;font-weight:700;">✅ 만료임박 없음</span>`;

  document.getElementById('homeSummary').innerHTML = `
    <div class="sum-card s-stock"><span class="sc-label">미개봉</span><span class="sc-num">${inStock}</span></div>
    <div class="sum-card s-total"><span class="sc-label">전체</span><span class="sc-num">${total}</span></div>
    <div class="sum-card s-inuse"><span class="sc-label">사용중</span><span class="sc-num">${inUse}</span></div>
    <div class="sum-card s-soon"><span class="sc-label">만료임박</span><span class="sc-num">${soon}</span></div>
  `;

  const maxStock = Math.max(1, ...data.brands.map(b =>
    data.items.filter(i => i.brand === b && (i.status === 'in-stock' || i.status === 'in-use')).length
  ));

  document.getElementById('homeBrandCards').innerHTML = data.brands.map(brand => {
    const brandItems = data.items.filter(i => i.brand === brand);
    if (!brandItems.length) return '';
    const bStock = brandItems.filter(i => i.status === 'in-stock').length;
    const bInUse = brandItems.filter(i => i.status === 'in-use').length;
    const bSoon  = brandItems.filter(i => {
      if (!i.expDate || i.status === 'used') return false;
      const diff = (new Date(i.expDate) - td) / 86400000;
      return diff >= 0 && diff <= 30;
    }).length;
    const bActive = bStock + bInUse;
    const barPct = Math.round((bActive / maxStock) * 100);

    const productGroups = {};
    brandItems.forEach(it => {
      if (!productGroups[it.product]) productGroups[it.product] = { stock: 0, inuse: 0, soon: 0 };
      if (it.status === 'in-stock') productGroups[it.product].stock++;
      if (it.status === 'in-use')   productGroups[it.product].inuse++;
      if (it.expDate && it.status !== 'used') {
        const diff = (new Date(it.expDate) - td) / 86400000;
        if (diff >= 0 && diff <= 30) productGroups[it.product].soon++;
      }
    });

    const productRows = Object.entries(productGroups).map(([name, cnt]) => {
      const badges = [];
      if (cnt.stock > 0) badges.push(`<span class="pr-badge stock">미개봉 ${cnt.stock}</span>`);
      if (cnt.inuse > 0) badges.push(`<span class="pr-badge inuse">사용중 ${cnt.inuse}</span>`);
      if (cnt.soon  > 0) badges.push(`<span class="pr-badge soon">⚠️만료</span>`);
      return `<div class="product-row">
        <div>
          <div class="pr-name">${name}</div>
          <div class="pr-bar"><div class="pr-bar-fill" style="width:${Math.min(100,(cnt.stock+cnt.inuse)*20)}%"></div></div>
        </div>
        <div class="pr-badges">${badges.join('')}</div>
      </div>`;
    }).join('');

    return `<div class="brand-card">
      <div class="brand-card-header" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'">
        <span class="bc-name">${brand}</span>
        <div class="bc-pills">
          ${bStock > 0 ? `<span class="bc-pill stock">재고 ${bStock}</span>` : ''}
          ${bInUse > 0 ? `<span class="bc-pill inuse">사용중 ${bInUse}</span>` : ''}
          ${bSoon  > 0 ? `<span style="font-size:0.65rem;color:#e6a800;font-weight:700;">⚠️${bSoon}</span>` : ''}
        </div>
      </div>
      <div class="brand-card-body">
        <div class="pr-bar" style="margin-bottom:8px;"><div class="pr-bar-fill" style="width:${barPct}%"></div></div>
        ${productRows}
      </div>
    </div>`;
  }).join('');
}

// ══════════════════════════════
// 브랜드 탭
// ══════════════════════════════
function renderBrandPage() {
  const query = (document.getElementById('brandSearchInput')?.value || '').trim().toLowerCase();
  const filtered = data.brands.filter(b => !query || b.toLowerCase().includes(query));
  if (!filtered.length) {
    document.getElementById('brandPageList').innerHTML = `<div class="brand-empty">검색 결과가 없습니다.</div>`;
    return;
  }
  document.getElementById('brandPageList').innerHTML = filtered.map(b => {
    const realIdx = data.brands.indexOf(b);
    const bItems  = data.items.filter(i => i.brand === b);
    const bStock  = bItems.filter(i => i.status === 'in-stock').length;
    const bInUse  = bItems.filter(i => i.status === 'in-use').length;
    const bTotal  = bItems.length;
    return `<div class="brand-list-item">
      <div class="bli-left">
        <div class="bli-name">${b}</div>
        <div class="bli-meta">
          <span>재고 <b style="color:var(--accent)">${bStock + bInUse}개</b></span>
          <span>상품 ${bTotal}개</span>
          ${bInUse > 0 ? `<span style="color:#7ab6d0;font-weight:700;">사용중 ${bInUse}</span>` : ''}
        </div>
      </div>
      <div class="bli-actions">
        <button class="icon-btn" onclick="openBrandEditModal(${realIdx})">✏️</button>
        <button class="icon-btn del" onclick="deleteBrand(${realIdx})">🗑️</button>
      </div>
    </div>`;
  }).join('');
}

function openBrandAddModal() {
  editBrandIdx = null;
  document.getElementById('brandAddModalTitle').textContent = '🏷️ 브랜드 추가';
  document.getElementById('newBrandInput').value = '';
  document.getElementById('brandAddModal').classList.add('open');
}
function openBrandEditModal(idx) {
  editBrandIdx = idx;
  document.getElementById('brandAddModalTitle').textContent = '✏️ 브랜드 수정';
  document.getElementById('newBrandInput').value = data.brands[idx];
  document.getElementById('brandAddModal').classList.add('open');
}
function saveBrand() {
  const v = document.getElementById('newBrandInput').value.trim();
  if (!v) return;
  if (editBrandIdx !== null) {
    const old = data.brands[editBrandIdx];
    data.brands[editBrandIdx] = v;
    data.items.forEach(it => { if (it.brand === old) it.brand = v; });
    if (currentProductBrand === old) currentProductBrand = v;
  } else {
    if (data.brands.includes(v)) { alert('이미 있는 브랜드입니다.'); return; }
    data.brands.push(v);
  }
  saveData(data); closeModal('brandAddModal'); render();
}
function deleteBrand(i) {
  const b = data.brands[i];
  if (data.items.some(it => it.brand === b)) {
    if (!confirm(`'${b}' 브랜드 상품이 있습니다. 삭제하시겠습니까?`)) return;
  }
  data.brands.splice(i, 1);
  if (currentProductBrand === b) currentProductBrand = data.brands[0] || '';
  saveData(data); render();
}

// ══════════════════════════════
// 상품 탭
// ══════════════════════════════
function renderProductTab() {
  document.getElementById('productBrandTabs').innerHTML = data.brands.map(b => {
    const cnt = data.items.filter(i => i.brand === b).length;
    return `<div class="brand-tab ${b===currentProductBrand?'active':''}" onclick="selectProductBrand('${b}')">
      ${b}<span class="cnt">${cnt}</span></div>`;
  }).join('');
  renderProductPanel();
}
function selectProductBrand(b) { currentProductBrand = b; renderProductTab(); }

function renderProductPanel() {
  const items = data.items.filter(i => i.brand === currentProductBrand);
  const el = document.getElementById('productPanel');
  if (!items.length) {
    el.innerHTML = `<div class="empty-state"><div class="icon">💄</div>등록된 상품이 없습니다.<br><br><button class="btn" onclick="openAddModal()">＋ 첫 상품 추가</button></div>`;
    return;
  }
  const groups = {};
  items.forEach(it => { if (!groups[it.product]) groups[it.product] = []; groups[it.product].push(it); });
  const td = today();

  el.innerHTML = Object.entries(groups).map(([product, list]) => {
    const inStock  = list.filter(i => i.status === 'in-stock').length;
    const inUse    = list.filter(i => i.status === 'in-use').length;
    const stockNum = inStock + inUse;
    const sorted   = list.slice().sort((a, b) => {
      const bd = new Date(a.buyDate) - new Date(b.buyDate);
      if (bd !== 0) return bd;
      const ae = a.expDate ? new Date(a.expDate) : new Date('9999-12-31');
      const be = b.expDate ? new Date(b.expDate) : new Date('9999-12-31');
      return ae - be;
    });
    const optGroups = {};
    sorted.forEach(it => { const k = it.option||''; if(!optGroups[k]) optGroups[k]=[]; optGroups[k].push(it); });

    const itemsHtml = Object.entries(optGroups).map(([option, optList]) => {
      const optHeader = option ? `<div class="option-header">${option}</div>` : '';
      const rows = optList.map(item => {
        const expD = item.expDate ? new Date(item.expDate) : null;
        const diff = expD ? (expD - td) / 86400000 : 999;
        let expClass = '', expLabel = '';
        if (expD) {
          if (diff < 0)        { expClass='expired'; expLabel='⚠️ 기한 만료'; }
          else if (diff <= 30) { expClass='soon';    expLabel=`⚠️ D-${Math.ceil(diff)} 만료임박`; }
          else                 { expLabel=`유효기간: ${item.expDate}`; }
        }
        const sMap = {'in-use':'사용중','in-stock':'미개봉','used':'사용완료','expired':'기한만료'};
        const useInfo = item.useDate ? `<div style="font-size:0.62rem;color:var(--text2);margin-top:2px;">개봉 ${item.useDate}</div>` : '';
        let actionBtn = '';
        if (item.status === 'in-stock') actionBtn = `<button class="open-btn" onclick="openUseModal(${item.id})">개봉</button>`;
        else if (item.status === 'in-use') actionBtn = `<button class="done-btn" onclick="openDoneModal(${item.id})">완료</button>`;
        const openDateCell = item.useDate ? item.useDate : '<span style="color:#ccc">-</span>';
        const expDateCell  = item.expDate  ? item.expDate  : '<span style="color:#ccc">-</span>';
        const memoCell     = item.memo     ? item.memo     : '<span style="color:#ccc">-</span>';
        return `<div class="purchase-item">
          <div class="swipe-table-wrap"><div class="swipe-table">
          <div class="item-label-row">
            <span>구매일자</span><span>구매금액</span><span>상태</span><span>메모</span><span>관리</span>
            <span>개봉일</span><span>유효기간</span>
          </div>
          <div class="item-value-row">
            <div class="cell">${item.buyDate}</div>
            <div class="cell price">${item.price ? Number(item.price).toLocaleString()+'원' : '-'}</div>
            <div class="cell"><span class="stag ${item.status}">${sMap[item.status]||''}</span></div>
            <div class="cell cell-extra">${memoCell}</div>
            <div class="cell actions">
              ${actionBtn}
              <div style="display:flex;gap:2px;">
                <button class="icon-btn" onclick="openEditModal(${item.id})">✏️</button>
                <button class="icon-btn del" onclick="deleteItem(${item.id})">🗑️</button>
              </div>
            </div>
            <div class="cell cell-extra">${openDateCell}</div>
            <div class="cell cell-extra ${expClass}">${expDateCell}${expClass==='soon'?' ⚠️':expClass==='expired'?' ❌':''}</div>
          </div>
          </div></div>
        </div>`;
      }).join('');
      return optHeader + rows;
    }).join('');

    return `<div class="product-block">
      <div class="product-block-header" onclick="toggleGroup(this)">
        <div class="pname">
          ${product}
          <span class="stock-pill">재고 ${stockNum}개</span>
          ${inUse > 0 ? `<span class="inuse-pill">사용중 ${inUse}</span>` : ''}
        </div>
        <span class="chevron open">▼</span>
      </div>
      <div class="purchase-list">${itemsHtml}</div>
    </div>`;
  }).join('');
}

function toggleGroup(header) {
  const list = header.nextElementSibling;
  const chev = header.querySelector('.chevron');
  const isHidden = list.style.display === 'none';
  list.style.display = isHidden ? 'block' : 'none';
  isHidden ? chev.classList.add('open') : chev.classList.remove('open');
}

// ══════════════════════════════
// 재고 탭
// ══════════════════════════════
const STATUS_FILTERS = [
  { key: 'all',      label: '전체' },
  { key: 'in-stock', label: '미개봉' },
  { key: 'in-use',   label: '사용중' },
  { key: 'soon',     label: '⚠️ 만료임박' },
];

function renderStockTab() {
  document.getElementById('statusFilterWrap').innerHTML = STATUS_FILTERS.map(f =>
    `<div class="status-chip ${f.key===currentStockFilter?'active':''}" onclick="selectStockFilter('${f.key}')">${f.label}</div>`
  ).join('');
  const td = today();
  let filtered = data.items.filter(i => {
    if (currentStockFilter === 'all')      return i.status !== 'used';
    if (currentStockFilter === 'in-stock') return i.status === 'in-stock';
    if (currentStockFilter === 'in-use')   return i.status === 'in-use';
    if (currentStockFilter === 'soon') {
      if (!i.expDate || i.status === 'used') return false;
      const diff = (new Date(i.expDate) - td) / 86400000;
      return diff >= 0 && diff <= 30;
    }
    return true;
  });
  filtered = filtered.slice().sort((a, b) => {
    const ae = a.expDate ? new Date(a.expDate) : new Date('9999-12-31');
    const be = b.expDate ? new Date(b.expDate) : new Date('9999-12-31');
    return ae - be;
  });
  const el = document.getElementById('stockList');
  if (!filtered.length) {
    el.innerHTML = `<div class="brand-empty">해당하는 재고가 없습니다.</div>`;
    return;
  }
  el.innerHTML = filtered.map(item => {
    const expD = item.expDate ? new Date(item.expDate) : null;
    const diff = expD ? (expD - td) / 86400000 : null;
    let expBadgeClass = 'none', expBadgeText = '기간 없음';
    if (expD) {
      if (diff < 0)        { expBadgeClass='expired'; expBadgeText='기한만료'; }
      else if (diff <= 30) { expBadgeClass='soon';    expBadgeText=`D-${Math.ceil(diff)}`; }
      else                 { expBadgeClass='ok';      expBadgeText=item.expDate; }
    }
    const sMap = {'in-use':'사용중','in-stock':'미개봉','used':'사용완료'};
    const label = item.option ? `${item.product} · ${item.option}` : item.product;
    return `<div class="stock-item">
      <div class="si-left">
        <div class="si-brand">${item.brand}</div>
        <div class="si-name">${label}</div>
        <div class="si-meta">
          <span class="si-status-tag ${item.status}">${sMap[item.status]||''}</span>
          ${item.price ? `<span style="font-size:0.68rem;color:var(--text2);">${Number(item.price).toLocaleString()}원</span>` : ''}
          ${item.memo  ? `<span style="font-size:0.65rem;color:var(--text2);">📝 ${item.memo}</span>` : ''}
        </div>
      </div>
      <div class="si-right">
        <span class="exp-badge ${expBadgeClass}">${expBadgeText}</span>
        <span style="font-size:0.63rem;color:var(--text2);">구매 ${item.buyDate}</span>
        <div style="display:flex;gap:3px;margin-top:2px;">
          <button class="icon-btn" onclick="openEditModal(${item.id})">✏️</button>
          <button class="icon-btn del" onclick="deleteItem(${item.id})">🗑️</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function selectStockFilter(f) { currentStockFilter = f; renderStockTab(); }

// ══════════════════════════════
// 추가 / 수정
// ══════════════════════════════
function openAddModal() {
  editItemId = null;
  document.getElementById('addModalTitle').textContent = '🛒 구매 내역 추가';
  clearForm();
  document.getElementById('inp_buyDate').value = todayStr();
  populateBrandSelect();
  document.getElementById('addModal').classList.add('open');
}
function openEditModal(id) {
  editItemId = id;
  const item = data.items.find(i => i.id === id); if (!item) return;
  document.getElementById('addModalTitle').textContent = '✏️ 내역 수정';
  populateBrandSelect(item.brand);
  document.getElementById('inp_product').value = item.product;
  document.getElementById('inp_option').value  = item.option || '';
  document.getElementById('inp_buyDate').value = item.buyDate;
  document.getElementById('inp_price').value   = item.price || '';
  document.getElementById('inp_expDate').value = item.expDate || '';
  document.getElementById('inp_memo').value    = item.memo || '';
  document.getElementById('addModal').classList.add('open');
}
function populateBrandSelect(selected) {
  document.getElementById('inp_brand').innerHTML =
    data.brands.map(b => `<option value="${b}" ${b===(selected||currentProductBrand)?'selected':''}>${b}</option>`).join('');
}
function clearForm() {
  ['inp_product','inp_option','inp_buyDate','inp_price','inp_expDate','inp_memo']
    .forEach(id => { document.getElementById(id).value = ''; });
}
function saveItem() {
  const brand   = document.getElementById('inp_brand').value;
  const product = document.getElementById('inp_product').value.trim();
  const option  = document.getElementById('inp_option').value.trim();
  const buyDate = document.getElementById('inp_buyDate').value;
  const price   = document.getElementById('inp_price').value;
  const expDate = document.getElementById('inp_expDate').value;
  const memo    = document.getElementById('inp_memo').value.trim();
  if (!product || !buyDate) { alert('상품명과 구매일자는 필수입니다.'); return; }
  if (editItemId) {
    Object.assign(data.items.find(i => i.id === editItemId),
      {brand, product, option, buyDate, price: price ? Number(price) : null, expDate, memo});
  } else {
    data.items.push({id: Date.now(), brand, product, option, buyDate,
      price: price ? Number(price) : null, expDate, memo, useDate: null, status: 'in-stock'});
  }
  saveData(data); currentProductBrand = brand; closeModal('addModal'); render();
}

// ══════════════════════════════
// 개봉 / 완료
// ══════════════════════════════
function openUseModal(id) {
  useItemId = id;
  const item = data.items.find(i => i.id === id);
  const label = item.option ? `${item.product} · ${item.option}` : item.product;
  document.getElementById('useModalDesc').textContent = `${item.brand} · ${label} (구매: ${item.buyDate})`;
  document.getElementById('inp_useDate').value = todayStr();
  document.getElementById('useModal').classList.add('open');
}
function confirmUse() {
  const useDate = document.getElementById('inp_useDate').value;
  if (!useDate) { alert('날짜를 입력해 주세요.'); return; }
  const item = data.items.find(i => i.id === useItemId);
  item.useDate = useDate; item.status = 'in-use';
  saveData(data); closeModal('useModal'); render();
}
function openDoneModal(id) {
  doneItemId = id;
  const item = data.items.find(i => i.id === id);
  const label = item.option ? `${item.product} · ${item.option}` : item.product;
  document.getElementById('doneModalDesc').textContent = `${item.brand} · ${label} (개봉: ${item.useDate||'-'})`;
  document.getElementById('inp_doneDate').value = todayStr();
  document.getElementById('doneModal').classList.add('open');
}
function confirmDone() {
  const doneDate = document.getElementById('inp_doneDate').value;
  const item = data.items.find(i => i.id === doneItemId);
  item.doneDate = doneDate || null; item.status = 'used';
  saveData(data); closeModal('doneModal'); render();
}

// ══════════════════════════════
// 삭제
// ══════════════════════════════
function deleteItem(id) {
  if (!confirm('삭제하시겠습니까?')) return;
  data.items = data.items.filter(i => i.id !== id); saveData(data); render();
}

// ══════════════════════════════
// 날짜 자동포맷
// ══════════════════════════════
function applyDateFmt(input) {
  input.addEventListener('input', function() {
    let v = this.value.replace(/\D/g,'');
    if (v.length<=4) this.value=v;
    else if (v.length<=6) this.value=v.slice(0,4)+'-'+v.slice(4);
    else this.value=v.slice(0,4)+'-'+v.slice(4,6)+'-'+v.slice(6,8);
  });
}
function initDateInputs() {
  ['inp_buyDate','inp_expDate','inp_useDate','inp_doneDate'].forEach(id => {
    const el = document.getElementById(id); if (el) applyDateFmt(el);
  });
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', e => { if (e.target === el) el.classList.remove('open'); });
});

initDateInputs();
render();

// 앱 시작 시 클라우드에서 불러오기
syncFromCloud();
</script>
</body>
</html>
