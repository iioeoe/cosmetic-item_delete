<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💄 화장품 재고 관리</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fefefe;
    --card: #fff8f7;
    --accent: #d4607a;
    --accent2: #e8a0b0;
    --accent3: #f7c5d0;
    --text: #3f3f3f;
    --text2: #5a5959;
    --border: #f0c8d0;
    --shadow: 0 2px 12px rgba(180,80,100,0.10);
    --radius: 14px;
    --tab-active: #d4607a;
    --tag-bg: #fde8ed;
    --tag-text: #b04060;
    --in-use: #e8f7e8;
    --in-use-text: #3a8040;
    --expired: #fdeaea;
    --expired-text: #b04040;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nanum Gothic', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 40px;
  }
  header {
    background: linear-gradient(135deg, #d4607a 0%, #e8a0b0 100%);
    color: #fff;
    padding: 22px 20px 16px;
    text-align: center;
    box-shadow: 0 2px 10px rgba(180,80,100,0.15);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.5px; }
  header p { font-size: 0.8rem; opacity: 0.85; margin-top: 2px; }

  .top-bar {
    display: flex;
    gap: 8px;
    padding: 14px 16px 0;
    justify-content: flex-end;
  }
  .btn {
    background: #EBA5A7;
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 8px 18px;
    font-family: 'Nanum Gothic', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: background 0.18s, transform 0.1s;
  }
  .btn:active { transform: scale(0.97); }
  .btn:hover { background: #d48a8c; }
  .btn.secondary {
    background: #fff;
    color: #EBA5A7;
    border: 1.5px solid #EBA5A7;
  }
  .btn.secondary:hover { background: #fde8ed; }

  /* 탭 */
  .brand-tabs {
    display: flex;
    gap: 0;
    overflow-x: auto;
    padding: 12px 16px 0;
    scrollbar-width: none;
  }
  .brand-tabs::-webkit-scrollbar { display: none; }
  .brand-tab {
    flex-shrink: 0;
    padding: 7px 16px;
    border-radius: 20px 20px 0 0;
    border: 1.5px solid var(--border);
    border-bottom: none;
    background: #fdf0f2;
    color: var(--text2);
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    margin-right: 4px;
    position: relative;
    bottom: -1px;
  }
  .brand-tab.active {
    background: var(--card);
    color: var(--accent);
    border-color: var(--accent2);
    border-bottom: 2px solid var(--card);
    z-index: 1;
  }
  .brand-tab .cnt {
    display: inline-block;
    background: var(--accent3);
    color: var(--accent);
    border-radius: 8px;
    font-size: 0.7rem;
    padding: 0 5px;
    margin-left: 4px;
    font-weight: 800;
  }
  .brand-tab.active .cnt { background: var(--accent); color: #fff; }

  /* 메인 */
  .main-panel {
    background: var(--card);
    border: 1.5px solid var(--accent2);
    border-radius: 0 var(--radius) var(--radius) var(--radius);
    margin: 0 16px;
    min-height: 300px;
    padding: 16px;
  }

  /* 상품명 그룹 */
  .product-group {
    margin-bottom: 18px;
  }
  .product-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    cursor: pointer;
    user-select: none;
  }
  .product-name {
    font-size: 0.97rem;
    font-weight: 800;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .stock-badge {
    background: var(--accent);
    color: #fff;
    border-radius: 10px;
    padding: 2px 9px;
    font-size: 0.75rem;
    font-weight: 700;
  }
  .stock-badge.zero { background: #ccc; }
  .chevron {
    color: var(--text2);
    font-size: 0.85rem;
    transition: transform 0.2s;
  }
  .chevron.open { transform: rotate(180deg); }

  /* 구매 아이템 */
  .purchase-list { display: flex; flex-direction: column; gap: 7px; }
  .purchase-item {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 13px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 4px 8px;
    align-items: start;
    position: relative;
  }
  .purchase-item .row1 {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
  }
  .purchase-date { font-size: 0.75rem; color: var(--text2); }
  .purchase-price {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--text);
  }
  .status-tag {
    font-size: 0.72rem;
    font-weight: 700;
    border-radius: 8px;
    padding: 2px 8px;
  }
  .status-tag.in-use { background: var(--in-use); color: var(--in-use-text); }
  .status-tag.in-stock { background: var(--tag-bg); color: var(--tag-text); }
  .status-tag.expired { background: var(--expired); color: var(--expired-text); }
  .status-tag.used { background: #f0f0f0; color: #888; }
  .exp-date {
    font-size: 0.72rem;
    color: var(--text2);
    grid-column: 1;
  }
  .exp-date.soon { color: #c06030; font-weight: 700; }
  .exp-date.expired { color: #b04040; font-weight: 700; }
  .item-actions {
    display: flex;
    flex-direction: column;
    gap: 4px;
    align-items: flex-end;
  }
  .icon-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1rem;
    padding: 2px 4px;
    border-radius: 6px;
    transition: background 0.15s;
  }
  .icon-btn:hover { background: #fde8ed; }
  .use-btn {
    font-size: 0.72rem;
    font-weight: 700;
    background: var(--tag-bg);
    color: var(--tag-text);
    border: 1px solid var(--accent3);
    border-radius: 8px;
    padding: 3px 8px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s;
  }
  .use-btn:hover { background: var(--accent3); }
  .use-date { font-size: 0.7rem; color: var(--text2); }

  /* 빈 상태 */
  .empty-state {
    text-align: center;
    padding: 50px 20px;
    color: var(--text2);
    font-size: 0.88rem;
  }
  .empty-state .icon { font-size: 2.5rem; margin-bottom: 10px; }

  /* 모달 오버레이 */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(80,20,30,0.35);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card);
    border-radius: var(--radius);
    padding: 24px 20px 20px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 8px 40px rgba(180,80,100,0.22);
    max-height: 92vh;
    overflow-y: auto;
  }
  .modal h2 {
    font-size: 1.1rem;
    font-weight: 800;
    color: var(--accent);
    margin-bottom: 18px;
  }
  .form-group { margin-bottom: 13px; }
  .form-group label {
    display: block;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--text2);
    margin-bottom: 4px;
  }
  .form-group input, .form-group select {
    width: 100%;
    padding: 9px 12px;
    border: 1.5px solid var(--border);
    border-radius: 9px;
    font-family: 'Nanum Gothic', sans-serif;
    font-size: 0.88rem;
    background: #fff;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  .form-group input:focus, .form-group select:focus {
    border-color: var(--accent);
  }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 18px;
    justify-content: flex-end;
  }

  /* 요약 카드 */
  .summary-bar {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin: 14px 16px 0;
  }
  .summary-card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 10px 8px;
    text-align: center;
  }
  .summary-card .num {
    font-size: 1.4rem;
    font-weight: 800;
    color: var(--accent);
    line-height: 1.1;
  }
  .summary-card .lbl {
    font-size: 0.7rem;
    color: var(--text2);
    margin-top: 2px;
  }

  @media (max-width: 480px) {
    .form-row { grid-template-columns: 1fr; }
    header h1 { font-size: 1.15rem; }
    .summary-card .num { font-size: 1.1rem; }
  }
</style>
</head>
<body>

<header>
  <h1>💄 화장품 재고 관리</h1>
  <p>구매내역 · 사용기록 · 잔여재고</p>
</header>

<div class="top-bar">
  <button class="btn secondary" onclick="openManageBrands()">🏷️ 브랜드 관리</button>
  <button class="btn" onclick="openAddModal()">＋ 구매 추가</button>
</div>

<div class="summary-bar" id="summaryBar"></div>

<div class="brand-tabs" id="brandTabs"></div>
<div class="main-panel" id="mainPanel"></div>

<!-- 구매 추가 모달 -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h2>🛒 구매 내역 추가</h2>
    <div class="form-group">
      <label>브랜드</label>
      <select id="inp_brand"></select>
    </div>
    <div class="form-group">
      <label>상품명</label>
      <input type="text" id="inp_product" placeholder="예: 수분크림, 토너 등">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>구매일자</label>
        <input type="text" id="inp_buyDate" placeholder="YYYY-MM-DD" maxlength="10">
      </div>
      <div class="form-group">
        <label>구매금액 (원)</label>
        <input type="number" id="inp_price" placeholder="0">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>유효기간</label>
        <input type="text" id="inp_expDate" placeholder="YYYY-MM-DD" maxlength="10">
      </div>
    </div>
    <div class="form-group">
      <label>메모</label>
      <input type="text" id="inp_memo" placeholder="구매처, 용량 등 메모">
    </div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal('addModal')">취소</button>
      <button class="btn" onclick="saveItem()">저장</button>
    </div>
  </div>
</div>

<!-- 브랜드 관리 모달 -->
<div class="modal-overlay" id="brandModal">
  <div class="modal">
    <h2>🏷️ 브랜드 관리</h2>
    <div style="display:flex;gap:8px;margin-bottom:14px;">
      <input type="text" id="newBrandInput" placeholder="새 브랜드명 입력"
        style="flex:1;padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;font-family:'Nanum Gothic',sans-serif;font-size:0.88rem;outline:none;">
      <button class="btn" onclick="addBrand()" style="border-radius:9px;padding:9px 14px;">추가</button>
    </div>
    <div id="brandList" style="display:flex;flex-direction:column;gap:7px;"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('brandModal')">완료</button>
    </div>
  </div>
</div>

<!-- 사용기록 모달 -->
<div class="modal-overlay" id="useModal">
  <div class="modal">
    <h2>✅ 사용 시작 기록</h2>
    <p style="font-size:0.85rem;color:var(--text2);margin-bottom:16px;" id="useModalDesc"></p>
    <div class="form-group">
      <label>사용 시작일</label>
      <input type="text" id="inp_useDate" placeholder="YYYY-MM-DD" maxlength="10">
    </div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal('useModal')">취소</button>
      <button class="btn" onclick="confirmUse()">확인</button>
    </div>
  </div>
</div>

<script>
// ── 데이터 ──────────────────────────────────────
const STORAGE_KEY = 'cosmeticTracker_v1';

function loadData() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || getDefaultData(); }
  catch { return getDefaultData(); }
}
function saveData(d) { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }
function getDefaultData() {
  return {
    brands: ['설화수', 'SK-II', '라네즈', '기타'],
    items: [
      { id: 1, brand: '설화수', product: '윤조에센스', buyDate: '2024-10-15', price: 85000, expDate: '2026-10-14', pao: '12M', memo: '백화점 구매', useDate: '2024-10-20', status: 'in-use' },
      { id: 2, brand: '설화수', product: '자음생크림', buyDate: '2024-11-01', price: 120000, expDate: '2026-10-31', pao: '12M', memo: '', useDate: null, status: 'in-stock' },
      { id: 3, brand: 'SK-II', product: '피테라에센스', buyDate: '2024-09-05', price: 195000, expDate: '2026-09-04', pao: '12M', memo: '면세점', useDate: '2024-09-10', status: 'in-use' },
      { id: 4, brand: 'SK-II', product: '피테라에센스', buyDate: '2025-01-20', price: 195000, expDate: '2027-01-19', pao: '12M', memo: '면세점', useDate: null, status: 'in-stock' },
      { id: 5, brand: '라네즈', product: '워터뱅크크림', buyDate: '2025-02-10', price: 39000, expDate: '2027-02-09', pao: '6M', memo: '', useDate: null, status: 'in-stock' },
    ]
  };
}

let data = loadData();
let currentBrand = data.brands[0] || '기타';
let editItemId = null;
let useItemId = null;

// ── 렌더 ──────────────────────────────────────
function render() {
  renderSummary();
  renderTabs();
  renderPanel();
}

function renderSummary() {
  const total = data.items.length;
  const inUse = data.items.filter(i => i.status === 'in-use').length;
  const inStock = data.items.filter(i => i.status === 'in-stock').length;
  const today = new Date(); today.setHours(0,0,0,0);
  const soon = data.items.filter(i => {
    if (!i.expDate) return false;
    const d = new Date(i.expDate);
    const diff = (d - today) / 86400000;
    return diff >= 0 && diff <= 30 && i.status !== 'used';
  }).length;
  document.getElementById('summaryBar').innerHTML = `
    <div class="summary-card"><div class="num">${total}</div><div class="lbl">전체 아이템</div></div>
    <div class="summary-card"><div class="num" style="color:#3a8040">${inUse}</div><div class="lbl">사용중</div></div>
    <div class="summary-card"><div class="num" style="color:${soon>0?'#c06030':'var(--accent)'}">${soon}</div><div class="lbl">만료 임박(30일)</div></div>
  `;
}

function renderTabs() {
  const el = document.getElementById('brandTabs');
  el.innerHTML = data.brands.map(b => {
    const cnt = data.items.filter(i => i.brand === b).length;
    const active = b === currentBrand ? 'active' : '';
    return `<div class="brand-tab ${active}" onclick="selectBrand('${b}')">
      ${b}<span class="cnt">${cnt}</span>
    </div>`;
  }).join('');
}

function renderPanel() {
  const items = data.items.filter(i => i.brand === currentBrand);
  const el = document.getElementById('mainPanel');
  if (!items.length) {
    el.innerHTML = `<div class="empty-state"><div class="icon">💄</div>이 브랜드에 등록된 상품이 없습니다.<br><br><button class="btn" onclick="openAddModal()">＋ 첫 상품 추가</button></div>`;
    return;
  }
  // 상품명별 그룹
  const groups = {};
  items.forEach(item => {
    if (!groups[item.product]) groups[item.product] = [];
    groups[item.product].push(item);
  });

  const today = new Date(); today.setHours(0,0,0,0);

  el.innerHTML = Object.entries(groups).map(([product, list]) => {
    const inStock = list.filter(i => i.status === 'in-stock').length;
    const inUse = list.filter(i => i.status === 'in-use').length;
    const stockNum = inStock + inUse;

    const itemsHtml = list.sort((a,b) => new Date(b.buyDate)-new Date(a.buyDate)).map(item => {
      const expD = item.expDate ? new Date(item.expDate) : null;
      const diff = expD ? (expD - today) / 86400000 : 999;
      let expClass = '', expLabel = '';
      if (expD) {
        if (diff < 0) { expClass = 'expired'; expLabel = '⚠️ 기한 만료'; }
        else if (diff <= 30) { expClass = 'soon'; expLabel = `⚠️ D-${Math.ceil(diff)} 만료임박`; }
        else expLabel = `유효: ${item.expDate}`;
      }
      let statusLabel = '', statusClass = '';
      if (item.status === 'in-use') { statusLabel = '사용중'; statusClass = 'in-use'; }
      else if (item.status === 'in-stock') { statusLabel = '미개봉'; statusClass = 'in-stock'; }
      else if (item.status === 'used') { statusLabel = '사용완료'; statusClass = 'used'; }
      else if (item.status === 'expired') { statusLabel = '기한만료'; statusClass = 'expired'; }

      const useBtn = (item.status === 'in-stock')
        ? `<button class="use-btn" onclick="openUseModal(${item.id})">개봉</button>` : '';
      const useInfo = item.useDate ? `<div class="use-date">개봉: ${item.useDate}</div>` : '';

      return `<div class="purchase-item">
        <div>
          <div class="row1">
            <span class="purchase-date">🛒 ${item.buyDate}</span>
            <span class="purchase-price">${item.price ? Number(item.price).toLocaleString()+'원' : '-'}</span>
            <span class="status-tag ${statusClass}">${statusLabel}</span>
          </div>
          ${expD ? `<div class="exp-date ${expClass}">${expLabel}</div>` : ''}
          ${useInfo}
          ${item.memo ? `<div style="font-size:0.72rem;color:var(--text2);margin-top:2px;">📝 ${item.memo}</div>` : ''}
        </div>
        <div class="item-actions">
          ${useBtn}
          <button class="icon-btn" title="수정" onclick="openEditModal(${item.id})">✏️</button>
          <button class="icon-btn" title="삭제" onclick="deleteItem(${item.id})">🗑️</button>
        </div>
      </div>`;
    }).join('');

    return `<div class="product-group">
      <div class="product-header" onclick="toggleGroup(this)">
        <div class="product-name">
          ${product}
          <span class="stock-badge ${stockNum===0?'zero':''}">잔여 ${stockNum}개</span>
          ${inUse>0?`<span style="font-size:0.72rem;color:var(--in-use-text);font-weight:700;">사용중 ${inUse}</span>`:''}
        </div>
        <span class="chevron open">▼</span>
      </div>
      <div class="purchase-list">${itemsHtml}</div>
    </div>`;
  }).join('');
}

function toggleGroup(header) {
  const list = header.nextElementSibling;
  const chev = header.querySelector('.chevron');
  if (list.style.display === 'none') {
    list.style.display = 'flex';
    chev.classList.add('open');
  } else {
    list.style.display = 'none';
    chev.classList.remove('open');
  }
}

function selectBrand(b) {
  currentBrand = b;
  render();
}

// ── 브랜드 관리 ──────────────────────────────────────
function openManageBrands() {
  renderBrandList();
  document.getElementById('brandModal').classList.add('open');
}
function renderBrandList() {
  document.getElementById('brandList').innerHTML = data.brands.map((b,i) =>
    `<div style="display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--border);border-radius:9px;padding:9px 13px;">
      <span style="font-weight:700;">${b}</span>
      <button class="icon-btn" onclick="deleteBrand(${i})" title="삭제">🗑️</button>
    </div>`
  ).join('');
}
function addBrand() {
  const v = document.getElementById('newBrandInput').value.trim();
  if (!v) return;
  if (data.brands.includes(v)) { alert('이미 있는 브랜드입니다.'); return; }
  data.brands.push(v);
  saveData(data);
  document.getElementById('newBrandInput').value = '';
  renderBrandList();
  render();
}
function deleteBrand(i) {
  const b = data.brands[i];
  if (data.items.some(it => it.brand === b)) {
    if (!confirm(`'${b}' 브랜드에 등록된 상품이 있습니다. 그래도 삭제하시겠습니까?`)) return;
  }
  data.brands.splice(i,1);
  if (currentBrand === b) currentBrand = data.brands[0] || '';
  saveData(data);
  renderBrandList();
  render();
}

// ── 구매 추가 / 수정 ──────────────────────────────────────
function openAddModal() {
  editItemId = null;
  document.querySelector('#addModal h2').textContent = '🛒 구매 내역 추가';
  clearForm();
  document.getElementById('inp_buyDate').value = today();
  populateBrandSelect();
  document.getElementById('addModal').classList.add('open');
}
function openEditModal(id) {
  editItemId = id;
  const item = data.items.find(i => i.id === id);
  if (!item) return;
  document.querySelector('#addModal h2').textContent = '✏️ 내역 수정';
  populateBrandSelect(item.brand);
  document.getElementById('inp_product').value = item.product;
  document.getElementById('inp_buyDate').value = item.buyDate;
  document.getElementById('inp_price').value = item.price || '';
  document.getElementById('inp_expDate').value = item.expDate || '';
  document.getElementById('inp_memo').value = item.memo || '';
  document.getElementById('addModal').classList.add('open');
}
function populateBrandSelect(selected) {
  const sel = document.getElementById('inp_brand');
  sel.innerHTML = data.brands.map(b => `<option value="${b}" ${b===(selected||currentBrand)?'selected':''}>${b}</option>`).join('');
}
function clearForm() {
  ['inp_product','inp_buyDate','inp_price','inp_expDate','inp_memo'].forEach(id => {
    document.getElementById(id).value = '';
  });
}
function saveItem() {
  const brand = document.getElementById('inp_brand').value;
  const product = document.getElementById('inp_product').value.trim();
  const buyDate = document.getElementById('inp_buyDate').value;
  const price = document.getElementById('inp_price').value;
  const expDate = document.getElementById('inp_expDate').value;
  const memo = document.getElementById('inp_memo').value.trim();
  if (!product || !buyDate) { alert('브랜드, 상품명, 구매일자는 필수입니다.'); return; }
  if (editItemId) {
    const item = data.items.find(i => i.id === editItemId);
    Object.assign(item, { brand, product, buyDate, price, expDate, memo });
  } else {
    data.items.push({
      id: Date.now(), brand, product, buyDate,
      price: price ? Number(price) : null,
      expDate, memo, useDate: null, status: 'in-stock'
    });
  }
  saveData(data);
  currentBrand = brand;
  closeModal('addModal');
  render();
}

// ── 사용 기록 ──────────────────────────────────────
function openUseModal(id) {
  useItemId = id;
  const item = data.items.find(i => i.id === id);
  document.getElementById('useModalDesc').textContent = `${item.brand} · ${item.product} (구매: ${item.buyDate})`;
  document.getElementById('inp_useDate').value = today();
  document.getElementById('useModal').classList.add('open');
}
function confirmUse() {
  const useDate = document.getElementById('inp_useDate').value;
  if (!useDate) { alert('날짜를 입력해 주세요.'); return; }
  const item = data.items.find(i => i.id === useItemId);
  item.useDate = useDate;
  item.status = 'in-use';
  saveData(data);
  closeModal('useModal');
  render();
}

// ── 삭제 ──────────────────────────────────────
function deleteItem(id) {
  if (!confirm('삭제하시겠습니까?')) return;
  data.items = data.items.filter(i => i.id !== id);
  saveData(data);
  render();
}

// ── 날짜 자동 포맷 (YYYY-MM-DD, 년4자리→월 자동이동) ──────────────────────────────────────
function applyDateAutoFormat(input) {
  input.addEventListener('input', function(e) {
    let v = this.value.replace(/\D/g, ''); // 숫자만
    let formatted = '';
    if (v.length <= 4) {
      formatted = v;
    } else if (v.length <= 6) {
      formatted = v.slice(0,4) + '-' + v.slice(4);
    } else {
      formatted = v.slice(0,4) + '-' + v.slice(4,6) + '-' + v.slice(6,8);
    }
    this.value = formatted;
  });
}

function initDateInputs() {
  ['inp_buyDate','inp_expDate','inp_useDate'].forEach(id => {
    const el = document.getElementById(id);
    if (el) applyDateAutoFormat(el);
  });
}

// ── 유틸 ──────────────────────────────────────
function today() {
  return new Date().toISOString().slice(0,10);
}
function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}
document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', e => { if (e.target === el) el.classList.remove('open'); });
});

initDateInputs();
render();
</script>
</body>
</html>
